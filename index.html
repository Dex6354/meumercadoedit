<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mercado</title>

    <meta property="og:title" content="Meu Mercado" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Sua lista de compras inteligente com comparador de preços e otimização." />
    <meta property="og:image" content="https://meumercado.pages.dev/01.png" />

    <link rel="icon" href="01.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --bg-color: #1a1a1a;
            --surface-color: rgba(38, 38, 38, 0.7);
            --surface-variant: #2d2d2d;
            --text-color: #f5f5f5;
            --secondary-text-color: #b3b3b3;
            --primary-color: #ffd43b;
            --primary-hover: #ffe066;
            --green-highlight: #2ed573;
            --danger-color: #ff4757;
            --yellow-sync-color: #ffa502;
            --border-radius: 16px;
            --input-bg-color: rgba(255, 255, 255, 0.05);
            --input-focus-bg: rgba(255, 255, 255, 0.08);
            --menu-width: 280px;
            --blur-effect: blur(20px);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #2c2c2c 0%, #1a1a1a 100%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- TELA DE LOGIN --- */
        #auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-box {
            background: var(--surface-color);
            backdrop-filter: var(--blur-effect);
            -webkit-backdrop-filter: var(--blur-effect);
            padding: 40px 30px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .auth-box h2 {
            color: var(--text-color);
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        .auth-box h2 i {
            color: var(--primary-color);
            margin-right: 10px;
        }
        .auth-input {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--input-bg-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        .auth-input:focus {
            outline: none;
            background-color: var(--input-focus-bg);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 212, 59, 0.2);
        }
        .password-container {
            position: relative;
            margin-bottom: 16px;
        }
        .password-container .auth-input {
            margin-bottom: 0;
            padding-right: 45px;
        }
        #togglePassword {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--secondary-text-color);
            transition: color 0.2s;
        }
        #togglePassword:hover {
            color: var(--text-color);
        }
        .auth-buttons {
            display: flex;
            gap: 12px;
            margin-top: 26px;
        }
        .auth-buttons .custom-btn {
            flex-grow: 1;
        }
        #auth-message {
            color: var(--danger-color);
            min-height: 20px;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        /* Ocultar app-container por padrão */
        #app-container {
            display: none;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: var(--blur-effect);
            -webkit-backdrop-filter: var(--blur-effect);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header .title img {
            height: 32px;
            width: auto;
            margin-right: 12px;
            border-radius: 8px;
        }
        .header .menu-icon { 
            font-size: 1.3rem; 
            cursor: pointer; 
            color: var(--text-color); 
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        .header .menu-icon:hover {
            background-color: var(--input-bg-color);
        }
        .header .title { 
            font-size: 1.3rem; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            white-space: nowrap; 
            position: absolute; 
            left: 50%; 
            transform: translateX(-50%); 
        }

        /* --- SIDE MENU & OVERLAY --- */
        .side-menu { 
            height: 100%; 
            width: 0; 
            position: fixed; 
            z-index: 1001; 
            top: 0; 
            left: 0; 
            background-color: #222;
            backdrop-filter: var(--blur-effect);
            overflow-x: hidden; 
            transition: 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); 
            padding-top: 80px; 
            box-shadow: 2px 0 20px rgba(0,0,0,0.6); 
        }
        .side-menu.open { width: var(--menu-width); }
        .side-menu .close-btn { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            font-size: 1.5rem; 
            color: var(--secondary-text-color); 
            cursor: pointer; 
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .side-menu .close-btn:hover {
            background-color: var(--input-bg-color);
            color: var(--text-color);
        }
        .side-menu a { 
            padding: 14px 24px; 
            text-decoration: none; 
            font-size: 1rem; 
            color: var(--secondary-text-color); 
            display: flex; 
            align-items: center;
            transition: 0.2s; 
            margin: 4px 12px;
            border-radius: 8px;
        }
        .side-menu a:hover { 
            background-color: var(--input-bg-color); 
            color: var(--text-color); 
        }
        .side-menu a i { 
            color: var(--secondary-text-color); 
            width: 24px; 
            font-size: 1.1rem;
            margin-right: 12px; 
            transition: color 0.2s;
        }
        .side-menu a:hover i {
            color: var(--primary-color);
        }
        #page-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); z-index: 1000; display: none; }
        #page-overlay.show { display: block; }

        /* --- CONTEÚDO PRINCIPAL --- */
        .container {
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .section {
            background: var(--surface-color);
            backdrop-filter: var(--blur-effect);
            -webkit-backdrop-filter: var(--blur-effect);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px;
            border-radius: var(--border-radius);
            margin-bottom: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
        }

        .shopping-list-section {
            padding: 24px;
        }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-header h2 { margin: 0; font-size: 1.4rem; font-weight: 600; color: var(--text-color); }
        .section-header .clear-btn { 
            background: var(--input-bg-color); 
            border: none; 
            color: var(--danger-color); 
            cursor: pointer; 
            font-size: 1rem; 
            transition: all 0.2s; 
            padding: 10px; 
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .section-header .clear-btn:hover { 
            background: rgba(255, 71, 87, 0.2);
            transform: scale(1.05);
        }

        /* --- BOTÕES --- */
        .custom-btn { 
            background-color: var(--primary-color); 
            color: #1a1a1a; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 0.95rem; 
            font-weight: 600; 
            padding: 12px 20px; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .custom-btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .custom-btn:active { transform: translateY(0); }
        .custom-btn.secondary { background-color: var(--input-bg-color); color: var(--text-color); border: 1px solid rgba(255,255,255,0.05); }
        .custom-btn.secondary:hover { background-color: var(--input-focus-bg); }
        .button-group { display: flex; gap: 12px; }

        /* --- TABELA E PREÇOS --- */
        .table-scroll-wrapper { width: 100%; margin-top: 8px; overflow-x: hidden; }
        .shopping-list-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; table-layout: fixed; }
        .shopping-list-table th { padding: 12px 8px; font-size: 0.8rem; color: var(--secondary-text-color); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; border: none; }
        .shopping-list-table td { padding: 8px; background: rgba(255, 255, 255, 0.02); border-top: 1px solid rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.03); vertical-align: middle; transition: all 0.2s ease; }
        .shopping-list-table tr:not(.add-item-row) td:first-child { border-left: 1px solid rgba(255,255,255,0.03); border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        .shopping-list-table tr:not(.add-item-row) td:last-child { border-right: 1px solid rgba(255,255,255,0.03); border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
        
        .shopping-list-table tr:not(.add-item-row):hover td {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .price-cell input { 
            width: 100%; 
            padding: 10px 4px; 
            text-align: right; 
            background-color: transparent; 
            color: var(--text-color); 
            border: 1px solid transparent; 
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .price-cell input:focus {
            background-color: var(--surface-variant);
            border-color: rgba(255,255,255,0.1);
            outline: none;
        }
        .price-cell input.default-price { color: var(--secondary-text-color) !important; }
        
        .item-name-input { 
            width: 100%; 
            background: none; 
            border: 1px solid transparent; 
            color: var(--text-color); 
            font-size: 0.95rem; 
            font-family: inherit; 
            padding: 10px 4px; 
            border-radius: 8px; 
            resize: none; 
            overflow-y: hidden; 
            line-height: 1.4; 
            transition: all 0.2s ease; 
        }
        .item-name-input:focus { outline: none; background-color: var(--surface-variant); border-color: rgba(255,255,255,0.1); }
        
        .shopping-list-table .action-btn { 
            background: none; 
            border: none; 
            color: var(--secondary-text-color); 
            cursor: pointer; 
            font-size: 1rem; 
            transition: color 0.2s; 
            padding: 8px; 
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }
        .shopping-list-table .action-btn:hover { color: var(--danger-color); background-color: rgba(255,71,87,0.1); }
        .shopping-list-table .action-btn.add { color: var(--primary-color); }
        .shopping-list-table .action-btn.add:hover { color: #1a1a1a; background-color: var(--primary-color); }
        
        .cheapest-price { color: var(--green-highlight) !important; font-weight: 600; }
        .cheapest-price::before { content: "• "; }
        .equal-price { color: var(--primary-color) !important; font-weight: 600; }
        
        /* Checkbox customizado estilo moderno */
        .shopping-list-table td input[type="checkbox"] { 
            appearance: none;
            -webkit-appearance: none;
            width: 20px; 
            height: 20px; 
            border: 2px solid var(--secondary-text-color);
            border-radius: 6px;
            background: transparent;
            cursor: pointer; 
            display: inline-grid;
            place-content: center;
            transition: all 0.2s;
            margin: 0 auto;
        }
        .shopping-list-table td input[type="checkbox"]::before {
            content: "\f00c";
            font-family: "Font Awesome 5 Free";
            font-weight: 900;
            font-size: 0.75rem;
            color: #1a1a1a;
            transform: scale(0);
            transition: transform 0.1s ease-in-out;
        }
        .shopping-list-table td input[type="checkbox"]:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .shopping-list-table td input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        .purchased td { opacity: 0.5; }
        .purchased .item-name-input { text-decoration: line-through; color: var(--secondary-text-color); }

        /* --- LINHA ADICIONAR ITEM --- */
        .add-item-row td {
            background: var(--input-bg-color) !important;
            border: 1px dashed rgba(255,255,255,0.1) !important;
        }
        .add-item-row td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; border-right: none !important; }
        .add-item-row td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; border-left: none !important; }

        /* --- SEÇÃO DO EMBED --- */
        .iframe-container { position: relative; border-radius: var(--border-radius); overflow: hidden; padding-top: 160%; border: 1px solid rgba(255,255,255,0.05); }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        #iframe-overlay, #iframe-overlay-2 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 26, 26, 0.9); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; flex-direction: column; gap: 15px; z-index: 5; color: var(--text-color); text-align: center; }
        
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary-color); border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .collapsible-header { cursor: pointer; padding: 4px 0; display: flex; justify-content: space-between; align-items: center; }
        .collapsible-header h2 { margin: 0; font-size: 1.3rem; font-weight: 600; color: var(--text-color); }
        .collapsible-header .fas.fa-chevron-down { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: var(--secondary-text-color); background: var(--input-bg-color); padding: 10px; border-radius: 50%; }
        .collapsible-header.active .fas.fa-chevron-down { transform: rotate(180deg); }
        .collapsible-content { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); padding: 0; }
        .collapsible-content.expanded { max-height: 120vh; padding-top: 20px; }
        
        .footer { text-align: center; padding: 24px; color: var(--secondary-text-color); font-size: 0.85rem; border-top: 1px solid rgba(255, 255, 255, 0.05); background: rgba(20, 20, 20, 0.5); margin-top: auto; width: 100%; }

        #sync-status-indicator { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            background-color: var(--green-highlight); 
            transition: background-color 0.3s ease; 
            flex-shrink: 0;
            box-shadow: 0 0 8px var(--green-highlight);
        }

        .header-right { display: flex; align-items: center; gap: 16px; }
        #username-display { color: var(--secondary-text-color); font-size: 0.9rem; display: flex; align-items: center; gap: 8px; font-weight: 500; }

        #sync-status-indicator.status-syncing { background-color: var(--yellow-sync-color); box-shadow: 0 0 8px var(--yellow-sync-color); }
        #sync-status-indicator.status-error { background-color: var(--danger-color); box-shadow: 0 0 8px var(--danger-color); }
        #sync-status-indicator.status-saved { background-color: var(--green-highlight); box-shadow: 0 0 8px var(--green-highlight); }
        #sync-status-indicator.status-offline { background-color: #5c6bc0; box-shadow: 0 0 8px #5c6bc0; }

        /* --- Autocomplete --- */
        #autocomplete-suggestions {
            position: absolute;
            background-color: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            z-index: 1002;
            max-height: 240px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            backdrop-filter: var(--blur-effect);
        }
        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.03); 
            transition: background-color 0.2s;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background-color: rgba(255,255,255,0.08); }

        /* Definição de tamanhos fixos e proporcionais por colunas para evitar estouro horizontal */
        .shopping-list-table colgroup col:nth-child(1) { width: 35px; }
        .shopping-list-table colgroup col:nth-child(2) { width: auto; }
        .shopping-list-table colgroup col:nth-child(3) { width: 85px; }
        .shopping-list-table colgroup col:nth-child(4) { width: 85px; }
        .shopping-list-table colgroup col:nth-child(5) { width: 40px; }

        /* Responsividade em Telas Menores (Garante ajuste fluido no mobile sem quebrar ou gerar scroll) */
        @media (max-width: 480px) {
            .container { padding: 12px; }
            .section { padding: 16px 12px; border-radius: 12px; }
            .header { padding: 12px 16px; }
            .shopping-list-table th, .shopping-list-table td { padding: 6px 4px; }
            .shopping-list-table th { font-size: 0.75rem; }
            .price-cell input { font-size: 0.85rem; padding: 8px 2px; }
            .item-name-input { font-size: 0.85rem; padding: 8px 2px; }
            .shopping-list-table colgroup col:nth-child(1) { width: 30px; }
            .shopping-list-table colgroup col:nth-child(3) { width: 75px; }
            .shopping-list-table colgroup col:nth-child(4) { width: 75px; }
            .shopping-list-table colgroup col:nth-child(5) { width: 35px; }
        }

        @media (min-width: 768px) { 
            .shopping-list-table colgroup col:nth-child(1) { width: 45px; }
            .shopping-list-table colgroup col:nth-child(3) { width: 110px; }
            .shopping-list-table colgroup col:nth-child(4) { width: 110px; }
            .shopping-list-table colgroup col:nth-child(5) { width: 45px; }
        }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-box">
            <h2><i class="fas fa-lock"></i> Acesso Secure</h2>
            <input type="text" id="username" class="auth-input" placeholder="Nome de usuário" autocomplete="username">
            <div class="password-container">
                <input type="password" id="password" class="auth-input" placeholder="Senha" autocomplete="current-password">
                <i class="fas fa-eye" id="togglePassword"></i>
            </div>
            <div class="auth-buttons">
                <button class="custom-btn" onclick="handleLogin()">Entrar</button>
                <button class="custom-btn secondary" onclick="handleRegister()">Cadastrar</button>
            </div>
            <p id="auth-message"></p>
        </div>
    </div>

    <div id="app-container">
        <div id="side-menu" class="side-menu">
            <a href="javascript:void(0)" class="close-btn" onclick="closeNav()">&times;</a>
            <a href="#"><i class="fas fa-list-check"></i> Minha Lista</a>
            <a href="itens"><i class="fas fa-archive"></i> Lista de Itens</a>
            <a href="#"><i class="fas fa-history"></i> Histórico</a>
            <a href="#"><i class="fas fa-tags"></i> Ofertas</a>
            <a href="javascript:void(0)" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Sair</a>
        </div>
        <div id="page-overlay" onclick="closeNav()"></div>

        <div id="main-content-wrapper">
            <div class="header">
                <span class="menu-icon" onclick="openNav()">&#9776;</span>
                <span class="title">
                    <img src="01.png" alt="Ícone">
                    Meu Mercado
                </span>

                <div class="header-right">
                    <span id="username-display"></span>
                    <div id="sync-status-indicator"></div>
                </div>
            </div>

            <div class="container">
                <div class="section shopping-list-section">
                    <div class="section-header">
                        <h2>Meus Itens</h2>
                        <button class="clear-btn" onclick="clearList()" title="Limpar toda a lista">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>

                    <div class="table-scroll-wrapper">
                        <table class="shopping-list-table">
                            <colgroup>
                                <col> <col> <col> <col> <col> </colgroup>
                            <thead>
                                <tr>
                                    <th><i class="fas fa-check"></i></th>
                                    <th style="text-align: left; padding-left: 4px;">Item</th>
                                    <th>Shibata</th>
                                    <th>Nagumo</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="shopping-list-body"></tbody>
                        </table>
                    </div>
                </div>

                <div class="section" id="comparator-section">
                    <div class="section-header collapsible-header" onclick="toggleComparator()">
                        <h2>Comparador de Preços</h2>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div id="comparator-content" class="collapsible-content">
                        <div id="iframe-wrapper" class="iframe-container">
                            <div id="iframe-overlay">
                                <div class="loader"></div>
                                <span>Acordando o comparador...</span>
                            </div>
                            <iframe id="streamlit-app" src="https://precosmercados.streamlit.app/?embed=true&minimal=true"></iframe>
                        </div>
                        <div class="button-group" style="margin-top: 16px;">
                            <button class="custom-btn" onclick="wakeUpApp()" style="flex-grow: 1;">
                                <i class="fas fa-sync-alt"></i> Ativar / Atualizar
                            </button>
                            <a href="https://precosmercados.streamlit.app/" target="_blank" rel="noopener noreferrer" class="custom-btn secondary" style="flex-grow: 1; text-align: center; text-decoration: none;">
                                <i class="fas fa-external-link-alt"></i> Abrir em Nova Guia
                            </a>
                        </div>
                    </div>
                </div>

                <div class="section" id="comparator-section-2">
                    <div class="section-header collapsible-header" onclick="toggleComparator2()">
                        <h2>Busca Preço Auto</h2>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div id="comparator-content-2" class="collapsible-content">
                        <div id="iframe-wrapper-2" class="iframe-container">
                            <div id="iframe-overlay-2">
                                <div class="loader"></div>
                                <span>Acordando o comparador...</span>
                            </div>
                            <iframe id="streamlit-app-2" src="https://buscaprecoauto.streamlit.app/?embed=true&minimal=true"></iframe>
                        </div>
                        <div class="button-group" style="margin-top: 16px;">
                            <button class="custom-btn" onclick="wakeUpApp2()" style="flex-grow: 1;">
                                <i class="fas fa-sync-alt"></i> Ativar / Atualizar
                            </button>
                            <a href="https://buscaprecoauto.streamlit.app/" target="_blank" rel="noopener noreferrer" class="custom-btn secondary" style="flex-grow: 1; text-align: center; text-decoration: none;">
                                <i class="fas fa-external-link-alt"></i> Abrir em Nova Guia
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="footer">
                Feito para facilitar suas compras. 🛒💡
            </footer>
        </div>
    </div>

    <div id="autocomplete-suggestions"></div>

    <script>
        // --- CONSTANTE DA API DE ITENS ---
        const WORKER_URL = '/api/shopping-list';

        // --- GERENCIAMENTO DE AUTENTICAÇÃO ---
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const authMessage = document.getElementById('auth-message');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        passwordInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                handleLogin();
            }
        });

        function showApp() {
            authContainer.style.display = 'none';
            appContainer.style.display = 'block';

            const username = localStorage.getItem('currentUser');
            const usernameDisplay = document.getElementById('username-display');
            if (username && usernameDisplay) {
                usernameDisplay.innerHTML = `<i class="fas fa-user"></i> ${username}`;
            }

            loadList();
            startPolling(); 
        }

        function showAuth(message = '', isError = false) {
            authContainer.style.display = 'flex';
            appContainer.style.display = 'none';
            authMessage.textContent = message;
            authMessage.style.color = isError ? 'var(--danger-color)' : 'var(--green-highlight)';
        }

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                showAuth('Por favor, preencha usuário e senha.', true);
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Erro ao fazer login.');
                }

                localStorage.setItem('authToken', data.token);
                localStorage.setItem('currentUser', username); 
                showApp();
            } catch (error) {
                showAuth(error.message, true);
            }
        }

        async function handleRegister() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                showAuth('Por favor, preencha usuário e senha para cadastrar.', true);
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                 if (!response.ok) {
                    throw new Error(data.message || 'Erro ao cadastrar.');
                }
                showAuth(data.message, false);
            } catch (error) {
                 showAuth(error.message, true);
            }
        }

        async function handleLogout() {
            stopPolling(); 
            const token = localStorage.getItem('authToken');
            if (token) {
                try {
                    await fetch('/api/logout', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                } catch (error) {
                    console.error("Logout failed, but proceeding.", error);
                }
            }
            localStorage.removeItem('authToken');
            const username = localStorage.getItem('currentUser');
            if (username) {
                 localStorage.removeItem(`shoppingList_${username}`);
                 localStorage.removeItem(`offlineList_${username}`);
                 localStorage.removeItem(`pendingDeletes_${username}`);
            }
            localStorage.removeItem('currentUser'); 
            location.reload();
        }

        function getAuthHeaders() {
            const token = localStorage.getItem('authToken');
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function openNav() { document.getElementById("side-menu").classList.add('open'); document.getElementById("page-overlay").classList.add('show'); }
        function closeNav() { document.getElementById("side-menu").classList.remove('open'); document.getElementById("page-overlay").classList.remove('show'); }
        document.addEventListener('keydown', (event) => { if (event.key === "Escape") closeNav(); });

        function toggleComparator() {
            document.querySelector('#comparator-section .collapsible-header').classList.toggle('active');
            document.getElementById('comparator-content').classList.toggle('expanded');
        }

        function toggleComparator2() {
            document.querySelector('#comparator-section-2 .collapsible-header').classList.toggle('active');
            document.getElementById('comparator-content-2').classList.toggle('expanded');
        }

        // --- Variáveis de Sincronização e Estado ---
        const tableBody = document.getElementById('shopping-list-body');
        const statusIndicator = document.getElementById('sync-status-indicator');
        const autocompleteSuggestions = document.getElementById('autocomplete-suggestions');
        let saveTimeout;
        let syncState = 'saved';
        let isOnline = navigator.onLine;
        let pollingIntervalId = null;

        // --- Autocomplete Item List (Loaded from KV) ---
        let itensList = [];

        async function carregarItens() {
            try {
                const response = await fetch(WORKER_URL); 
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                itensList = await response.json();
                console.log(`Itens de Autocomplete carregados: ${itensList.length}`);
            } catch (error) {
                console.error('Falha ao carregar lista de itens da API (Pode ser o primeiro acesso offline):', error);
                itensList = [];
            }
        }

        let currentActiveInput = null;

        function normalizeString(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        function setSyncStatus(newState) {
            syncState = newState;
            statusIndicator.className = `status-${newState}`;
            if (newState === 'error') {
                setTimeout(() => { if (syncState === 'error') setSyncStatus('offline'); }, 3000);
            }
        }

        // --- LÓGICA DE POLLING (SINCRONIZAÇÃO CONTÍNUA) ---
        function stopPolling() {
            if (pollingIntervalId) {
                clearInterval(pollingIntervalId);
                pollingIntervalId = null;
            }
        }

        function startPolling() {
            stopPolling();
            pollingIntervalId = setInterval(pollForChanges, 4000);
        }

        async function pollForChanges() {
            const activeEl = document.activeElement;

            if (!isOnline || 
                document.hidden || 
                syncState === 'syncing' || 
                (activeEl && ['INPUT', 'TEXTAREA'].includes(activeEl.tagName) && tableBody.contains(activeEl))) 
            {
                return;
            }

            try {
                const response = await fetch('/api/list', { headers: getAuthHeaders() });
                if (response.status === 401) return handleLogout();
                if (!response.ok) return;

                const remoteItems = await response.json();
                const localItems = getCurrentLocalItems();

                if (JSON.stringify(remoteItems) !== JSON.stringify(localItems)) {
                    redrawTable(remoteItems, false);
                }
            } catch (error) {
                // Falha silenciosa
            }
        }

        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }

        function getCurrentLocalItems() {
            const items = [];
            document.querySelectorAll('#shopping-list-body tr:not(.add-item-row)').forEach(row => {
                const name = row.cells[1].querySelector('textarea').value.trim();
                if (name) {
                    items.push({
                        id: row.dataset.id ? parseInt(row.dataset.id) : null,
                        name: name,
                        priceShibata: row.cells[2].querySelector('input').value || 'R$ 0,00',
                        priceNagumo: row.cells[3].querySelector('input').value || 'R$ 0,00',
                        purchased: row.classList.contains('purchased')
                    });
                }
            });
            return items;
        }

        // --- LÓGICA DE SINCRONIZAÇÃO E CACHE OFFLINE ---
        async function saveList() {
            const items = getCurrentLocalItems();
            const username = localStorage.getItem('currentUser');
            if (!username) return;

            const pendingDeletes = JSON.parse(localStorage.getItem(`pendingDeletes_${username}`) || '[]');

            if (!isOnline) {
                setSyncStatus('offline');
                console.log("Offline: Salvando alterações localmente.");
                localStorage.setItem(`offlineList_${username}`, JSON.stringify(items));
                return;
            }

            setSyncStatus('syncing'); 
            await saveListOnline(items, pendingDeletes);
        }

        async function saveListOnline(items, deletes = []) {
            const username = localStorage.getItem('currentUser');
            if (!username) return;

            try {
                const response = await fetch('/api/list', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ items: items, deletes: deletes })
                });
                if (response.status === 401) return handleLogout();
                if (!response.ok) throw new Error('Falha ao salvar no servidor.');

                const mergedItems = await response.json();
                setSyncStatus('saved');

                localStorage.setItem(`shoppingList_${username}`, JSON.stringify(mergedItems));
                localStorage.removeItem(`offlineList_${username}`);
                localStorage.removeItem(`pendingDeletes_${username}`);

                const activeEl = document.activeElement;
                const isTypingInTable = activeEl && ['INPUT', 'TEXTAREA'].includes(activeEl.tagName) && tableBody.contains(activeEl);

                if (!isTypingInTable) {
                    redrawTable(mergedItems, false); 
                } else {
                    console.log("Usuário digitando, adiando redesenho da UI.");
                }

            } catch (error) {
                setSyncStatus('error');
                console.error("Erro ao salvar online:", error);
            }
        }

        async function syncOfflineChanges() {
            const username = localStorage.getItem('currentUser');
            if (!username) return;

            const pendingItemsJSON = localStorage.getItem(`offlineList_${username}`);
            const pendingDeletes = JSON.parse(localStorage.getItem(`pendingDeletes_${username}`) || '[]');

            if (!pendingItemsJSON && pendingDeletes.length === 0) {
                console.log("Nenhuma alteração offline para sincronizar.");
                return;
            }

            console.log("Conectado. Sincronizando alterações pendentes...");

            try {
                const localOfflineItems = pendingItemsJSON
                    ? JSON.parse(pendingItemsJSON)
                    : JSON.parse(localStorage.getItem(`shoppingList_${username}`) || '[]');

                setSyncStatus('syncing');
                await saveListOnline(localOfflineItems, pendingDeletes);

            } catch (error) {
                console.error("Falha ao sincronizar as alterações offline:", error);
                setSyncStatus('error');
            }
        }

        async function loadList() {
            const username = localStorage.getItem('currentUser');
            if (!username) return;

            const offlineKey = `offlineList_${username}`;
            const cacheKey = `shoppingList_${username}`;
            const pendingDeletes = JSON.parse(localStorage.getItem(`pendingDeletes_${username}`) || '[]');
            const pendingOfflineItems = JSON.parse(localStorage.getItem(offlineKey));

            if (pendingOfflineItems) {
                console.log("Carregando lista com alterações offline pendentes.");
                redrawTable(pendingOfflineItems);
                setSyncStatus('offline');
                return;
            }

            if (pendingDeletes.length > 0) {
                setSyncStatus('offline');
            }

            if (!isOnline) {
                console.log("Offline. Carregando lista do cache.");
                if (syncState !== 'offline') setSyncStatus('offline');
                const cachedItems = JSON.parse(localStorage.getItem(cacheKey) || '[]');
                redrawTable(cachedItems);
                return;
            }

            if (syncState !== 'offline') setSyncStatus('syncing');
            try {
                const response = await fetch('/api/list', { headers: getAuthHeaders() });
                if (response.status === 401) return handleLogout();
                if (!response.ok) throw new Error('Falha ao buscar dados.');

                const remoteItems = await response.json();
                localStorage.setItem(cacheKey, JSON.stringify(remoteItems));
                redrawTable(remoteItems, true);
                if (syncState !== 'offline') setSyncStatus('saved');

            } catch (error) {
                console.error('Erro ao buscar lista online, usando cache como fallback:', error);
                setSyncStatus('offline'); 
                const cachedItems = JSON.parse(localStorage.getItem(cacheKey) || '[]');
                redrawTable(cachedItems);
            }
        }

        const debouncedSave = debounce(saveList, 1500);

        // --- Funções de UI ---
        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        tableBody.addEventListener('input', (event) => {
            const target = event.target;
            if (target.tagName.toLowerCase() === 'textarea') {
                autoResizeTextarea(target);

                if (target.classList.contains('item-name-input')) { 
                    currentActiveInput = target; 
                    updateAutocompletePosition(); 
                    debouncedHandleAutocomplete(event); 
                }
            }

            const row = target.closest('tr');
            if (row && !row.classList.contains('add-item-row') && ['textarea', 'input'].includes(target.tagName.toLowerCase())) {
                setSyncStatus('syncing');
                debouncedSave();
            }
        });

        tableBody.addEventListener('focus', (event) => {
            const target = event.target;
            if (target.tagName.toLowerCase() === 'input' && target.type === 'text') {
                setTimeout(() => {
                    if (target.value !== '') {
                        const valueLength = target.value.length;
                        target.setSelectionRange(valueLength, valueLength);
                    }
                }, 1);
            }
            if (target.tagName.toLowerCase() === 'textarea' && target.classList.contains('item-name-input')) { 
                currentActiveInput = target; 
                handleAutocompleteInput(event); 
            } else if (target.tagName.toLowerCase() === 'textarea') {
                 closeAutocomplete();
            }
        }, true);

        tableBody.addEventListener('blur', (event) => {
            const target = event.target;
            const row = target.closest('tr'); 

            if (target.tagName.toLowerCase() === 'input' && target.type === 'text' && row && !row.classList.contains('add-item-row')) {
                formatCurrency(event.target);
                comparePrices(event.target);
                setSyncStatus('syncing');
                debouncedSave();
            }

            if (event.target.tagName.toLowerCase() === 'textarea' && event.target.classList.contains('item-name-input')) {
                setTimeout(() => {
                    if (!autocompleteSuggestions.matches(':hover')) {
                        closeAutocomplete();
                    }
                }, 50); 
            }
        }, true);

        // --- Funções do Autocomplete ---
        function updateAutocompletePosition() {
            if (currentActiveInput) { 
                const rect = currentActiveInput.getBoundingClientRect();
                autocompleteSuggestions.style.top = `${rect.bottom + window.scrollY}px`;
                autocompleteSuggestions.style.left = `${rect.left + window.scrollX}px`;
                autocompleteSuggestions.style.width = `${rect.width + 16}px`;
            }
        }
        window.addEventListener('scroll', updateAutocompletePosition, true);
        window.addEventListener('resize', updateAutocompletePosition);

        function closeAutocomplete() {
            autocompleteSuggestions.style.display = 'none';
        }

        const handleAutocompleteInput = (event) => {
            const inputText = (event.target.value || '').trim();
            currentActiveInput = event.target; 
            updateAutocompletePosition(); 

            if (inputText.length < 1 || !itensList || itensList.length === 0) {
                autocompleteSuggestions.style.display = 'none';
                return;
            }

            const normalizedInput = normalizeString(inputText);
            const filteredItens = itensList.filter(item => 
                normalizeString(item.nome).includes(normalizedInput)
            );

            if (filteredItens.length > 0) {
                const suggestionsHTML = filteredItens
                    .map(item => `<div class="suggestion-item" data-name="${item.nome.replace(/"/g, '&quot;')}"><span>${item.nome}</span></div>`)
                    .slice(0, 10)
                    .join('');
                autocompleteSuggestions.innerHTML = suggestionsHTML;
                autocompleteSuggestions.style.display = 'block';
            } else {
                autocompleteSuggestions.style.display = 'none';
            }
        };

        const debouncedHandleAutocomplete = debounce(handleAutocompleteInput, 150);

        autocompleteSuggestions.addEventListener('mousedown', (event) => {
            const suggestionItem = event.target.closest('.suggestion-item');
            if (suggestionItem && currentActiveInput) {
                event.preventDefault();
                const nome = suggestionItem.dataset.name;
                currentActiveInput.value = nome;

                closeAutocomplete();
                autoResizeTextarea(currentActiveInput);

                if (currentActiveInput.id === 'newItemName') {
                    commitItem(); 
                } else {
                    setSyncStatus('syncing');
                    debouncedSave();
                }
            }
        });

        function createAddItemRow(shouldFocus = false) {
            document.querySelector('.add-item-row')?.remove();
            const newRow = tableBody.insertRow(0);
            newRow.classList.add('add-item-row');
            newRow.innerHTML = `
                <td></td>
                <td><textarea id="newItemName" class="item-name-input" placeholder="Adicionar item" rows="1"></textarea></td>
                <td class="price-cell"><input type="text" placeholder="R$ 0,00"></td>
                <td class="price-cell"><input type="text" placeholder="R$ 0,00"></td>
                <td style="text-align: center;"><button class="action-btn add" onclick="commitItem()"><i class="fas fa-plus"></i></button></td>
            `;
            const newItemInput = document.getElementById('newItemName');
            newItemInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && !event.shiftKey && autocompleteSuggestions.style.display !== 'block') {
                    event.preventDefault();
                    commitItem();
                }
            });
            if (shouldFocus) newItemInput.focus();
        }

        function commitItem() {
            const itemNameInput = document.getElementById('newItemName');
            const itemName = itemNameInput.value.trim();
            if (itemName === '') {
                itemNameInput.focus();
                return;
            }

            closeAutocomplete();

            const row = itemNameInput.closest('tr');
            const priceShibata = row.cells[2].querySelector('input').value || 'R$ 0,00';
            const priceNagumo = row.cells[3].querySelector('input').value || 'R$ 0,00';

            buildItemRow({ 
                id: null, 
                name: itemName, 
                priceShibata: priceShibata, 
                priceNagumo: priceNagumo, 
                purchased: false 
            }, true); 

            createAddItemRow(true);
            saveList();
        }

        function buildItemRow(itemData, isNew = false) {
            const newRow = tableBody.insertRow(isNew ? 0 : tableBody.rows.length);
            if (itemData.purchased) newRow.classList.add('purchased');

            newRow.dataset.id = itemData.id || '';

            const getPriceInputHTML = (price) => {
                const hasValue = price && price.trim() !== 'R$ 0,00';
                return `<input type="text" ${hasValue ? `value="${price}"` : ''} placeholder="R$ 0,00">`;
            };

            newRow.innerHTML = `
                <td><input type="checkbox" onchange="togglePurchased(this)" ${itemData.purchased ? 'checked' : ''}></td>
                <td><textarea class="item-name-input" rows="1">${itemData.name}</textarea></td>
                <td class="price-cell">${getPriceInputHTML(itemData.priceShibata)}</td>
                <td class="price-cell">${getPriceInputHTML(itemData.priceNagumo)}</td>
                <td style="text-align: center;"><button class="action-btn" onclick="removeItem(this)"><i class="fas fa-trash-alt"></i></button></td>
            `;
            autoResizeTextarea(newRow.cells[1].querySelector('textarea'));
            comparePrices(newRow.cells[2].querySelector('input'));
        }

        function redrawTable(items, shouldFocusNewItem = true) {
            tableBody.innerHTML = '';
            if (items && items.length > 0) {
                items.forEach(item => buildItemRow(item, false));
                sortAndGroup();
            }
            createAddItemRow(shouldFocusNewItem);
        }

        function removeItem(button) {
            if (confirm('Tem certeza de que deseja remover este item?')) {
                const row = button.closest('tr');
                const id = row.dataset.id;
                const username = localStorage.getItem('currentUser');

                if (id && username) {
                    const key = `pendingDeletes_${username}`;
                    const pendingDeletes = JSON.parse(localStorage.getItem(key) || '[]');
                    if (!pendingDeletes.includes(parseInt(id))) {
                        pendingDeletes.push(parseInt(id));
                        localStorage.setItem(key, JSON.stringify(pendingDeletes));
                    }
                }

                row.remove();
                saveList();
            }
        }

        function togglePurchased(checkbox) {
            checkbox.closest('tr').classList.toggle('purchased', checkbox.checked);
            saveList();
        }

        function clearList() {
            if (confirm('Tem certeza que deseja limpar toda a lista?')) {
                const username = localStorage.getItem('currentUser');
                if (!username) return;

                const allRows = Array.from(tableBody.querySelectorAll('tr:not(.add-item-row)'));
                const idsToDelete = [];

                allRows.forEach(row => {
                    const id = row.dataset.id;
                    if (id) {
                        idsToDelete.push(parseInt(id));
                    }
                    row.remove();
                });

                if (idsToDelete.length > 0) {
                    const key = `pendingDeletes_${username}`;
                    const pendingDeletes = JSON.parse(localStorage.getItem(key) || '[]');
                    idsToDelete.forEach(id => {
                        if (!pendingDeletes.includes(id)) {
                            pendingDeletes.push(id);
                        }
                    });
                    localStorage.setItem(key, JSON.stringify(pendingDeletes));
                }

                saveList();
                createAddItemRow(true); 
            }
        }

        // --- Eventos de Conexão ---
        window.addEventListener('online', async () => {
            isOnline = true;
            await syncOfflineChanges(); 
            await loadList(); 
            startPolling();
        });
        window.addEventListener('offline', () => {
            isOnline = false;
            stopPolling();
            setSyncStatus('offline');
        });

        // --- Funções de Formatação e Comparação de Preços ---
        function formatCurrency(input) {
            const value = input.value.trim();
            const number = parseValueToFloat(value);
            if (isNaN(number) || number === 0) {
                input.value = '';
                input.placeholder = 'R$ 0,00';
            } else {
                input.value = number.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                input.placeholder = 'R$ 0,00';
            }
        }

        function parseValueToFloat(value) {
            if (!value) return NaN;
            return parseFloat(value.replace('R$', '').trim().replace('.', '').replace(',', '.'));
        }

        function comparePrices(input) {
            const row = input.closest('tr');
            if (!row || row.classList.contains('add-item-row')) return;
            const shibataInput = row.cells[2].querySelector('input');
            const nagumoInput = row.cells[3].querySelector('input');
            shibataInput.classList.remove('cheapest-price', 'equal-price');
            nagumoInput.classList.remove('cheapest-price', 'equal-price');
            const shibataPrice = parseValueToFloat(shibataInput.value);
            const nagumoPrice = parseValueToFloat(nagumoInput.value);
            const validShibata = !isNaN(shibataPrice) && shibataPrice > 0;
            const validNagumo = !isNaN(nagumoPrice) && nagumoPrice > 0;
            if (validShibata && validNagumo) {
                if (shibataPrice < nagumoPrice) shibataInput.classList.add('cheapest-price');
                else if (nagumoPrice < shibataPrice) nagumoInput.classList.add('cheapest-price');
                else { shibataInput.classList.add('equal-price'); nagumoInput.classList.add('equal-price'); }
            } else if (validShibata) { shibataInput.classList.add('cheapest-price');
            } else if (validNagumo) { nagumoInput.classList.add('cheapest-price'); }
            sortAndGroup();
        }

        function sortAndGroup() {
            const allRows = Array.from(tableBody.querySelectorAll('tr:not(.add-item-row)'));
            const unpriced = [], shibata = [], equal = [], nagumo = [];
            allRows.forEach(row => {
                const pS = parseValueToFloat(row.cells[2].querySelector('input').value);
                const pN = parseValueToFloat(row.cells[3].querySelector('input').value);
                const vS = !isNaN(pS) && pS > 0, vN = !isNaN(pN) && pN > 0;
                if (!vS && !vN) unpriced.push(row);
                else if (vS && vN && pS === pN) equal.push(row);
                else if (vS && (!vN || pS < pN)) shibata.push(row);
                else nagumo.push(row);
            });

            [...unpriced, ...shibata, ...equal, ...nagumo].forEach(row => tableBody.appendChild(row));
        }

        // --- Funções Auxiliares (Streamlit, Teclado Virtual) ---
        function wakeUpApp() {
            const iframeWrapper = document.getElementById('iframe-wrapper');
            const iframeOverlay = document.getElementById('iframe-overlay');
            iframeOverlay.style.display = 'flex';
            let streamlitIframe = document.getElementById('streamlit-app');
            if (streamlitIframe) streamlitIframe.remove();
            const newIframe = document.createElement('iframe');
            newIframe.id = 'streamlit-app';
            newIframe.src = `https://precosmercados.streamlit.app/?embed=true&minimal=true&t=${new Date().getTime()}`;
            newIframe.onload = () => { iframeOverlay.style.display = 'none'; };
            iframeWrapper.prepend(newIframe);
        }

        function wakeUpApp2() {
            const iframeWrapper = document.getElementById('iframe-wrapper-2');
            const iframeOverlay = document.getElementById('iframe-overlay-2');
            iframeOverlay.style.display = 'flex';
            let streamlitIframe = document.getElementById('streamlit-app-2');
            if (streamlitIframe) streamlitIframe.remove();
            const newIframe = document.createElement('iframe');
            newIframe.id = 'streamlit-app-2';
            newIframe.src = `https://buscaprecoauto.streamlit.app/?embed=true&minimal=true&t=${new Date().getTime()}`;
            newIframe.onload = () => { iframeOverlay.style.display = 'none'; };
            iframeWrapper.prepend(newIframe);
        }

        function setupVirtualKeyboardListener() {
            if (!window.visualViewport) return;
            const isLikelyKeyboardOpen = () => window.innerHeight - window.visualViewport.height > 150;
            let keyboardWasOpen = isLikelyKeyboardOpen();
            window.visualViewport.addEventListener('resize', () => {
                const keyboardIsOpen = isLikelyKeyboardOpen();
                if (keyboardWasOpen && !keyboardIsOpen) {
                    if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                         document.activeElement.blur();
                    }
                }
                keyboardWasOpen = keyboardIsOpen;
            });
        }

        // --- INICIALIZAÇÃO DA APLICAÇÃO ---
        document.addEventListener('DOMContentLoaded', async () => {
            await carregarItens();

            if (localStorage.getItem('authToken')) {
                showApp();
            } else {
                showAuth();
            }
            setupVirtualKeyboardListener();
            
            const username = localStorage.getItem('currentUser');
            let hasPending = false;
            if (username) {
                const pendingItems = localStorage.getItem(`offlineList_${username}`);
                const pendingDeletes = localStorage.getItem(`pendingDeletes_${username}`);
                if (pendingItems || (pendingDeletes && pendingDeletes !== '[]')) {
                    hasPending = true;
                }
            }

            if (!isOnline || hasPending) {
                setSyncStatus('offline');
            } else {
                setSyncStatus('saved');
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                console.log('ServiceWorker registrado com sucesso: ', registration.scope);
                })
                .catch(error => {
                console.log('Falha ao registrar o ServiceWorker: ', error);
                });
            });
        }
    </script>
