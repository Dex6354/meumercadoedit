<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mercado</title>

    <meta property="og:title" content="Meu Mercado" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Sua lista de compras inteligente com comparador de preços e otimização." />
    <meta property="og:image" content="https://meumercado.pages.dev/01.png" />

    <link rel="icon" href="01.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --bg-color: #212121;
            --card-color: #2c2c2c;
            --text-color: #f0f0f0;
            --secondary-text-color: #a0a0a0;
            --primary-color: #ffc107;
            --green-highlight: #4CAF50;
            --danger-color: #f44336;
            --yellow-sync-color: #ffc107;
            --border-radius: 12px;
            --input-bg-color: #383838;
            --menu-width: 250px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- TELA DE LOGIN --- */
        #auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-box {
            background-color: var(--card-color);
            padding: 30px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .auth-box h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
        }
        .auth-input {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg-color);
            border: 1px solid #444;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 15px;
        }
        .password-container {
            position: relative;
            margin-bottom: 15px;
        }
        .password-container .auth-input {
            margin-bottom: 0;
            padding-right: 40px;
        }
        #togglePassword {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--secondary-text-color);
        }
        .auth-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .auth-buttons .custom-btn {
            flex-grow: 1;
        }
        #auth-message {
            color: var(--danger-color);
            min-height: 20px;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        /* Ocultar app-container por padrão */
        #app-container {
            display: none;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--input-bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--bg-color);
        }
        .header .title img {
            height: 30px;
            width: auto;
            margin-right: 10px;
            border-radius: 5px;
        }
        .header .menu-icon { font-size: 1.5rem; cursor: pointer; color: var(--primary-color); padding: 5px; }
        .header .title { font-size: 1.25rem; font-weight: bold; display: flex; align-items: center; white-space: nowrap; position: absolute; left: 50%; transform: translateX(-50%); }
        .header .title i { margin-right: 8px; color: var(--primary-color); }

        /* --- SIDE MENU & OVERLAY --- */
        .side-menu { height: 100%; width: 0; position: fixed; z-index: 1001; top: 0; left: 0; background-color: var(--card-color); overflow-x: hidden; transition: 0.3s; padding-top: 60px; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        .side-menu.open { width: var(--menu-width); }
        .side-menu .close-btn { position: absolute; top: 15px; right: 25px; font-size: 2rem; color: var(--primary-color); cursor: pointer; line-height: 1; }
        .side-menu a { padding: 15px 20px; text-decoration: none; font-size: 1.1rem; color: var(--text-color); display: block; transition: 0.3s; border-bottom: 1px solid var(--input-bg-color); }
        .side-menu a:hover { background-color: #575757; color: var(--primary-color); }
        .side-menu a i { color: var(--primary-color); width: 20px; text-align: center; margin-right: 10px; }
        #page-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; display: none; transition: opacity 0.3s; }
        #page-overlay.show { display: block; }

        /* --- CONTEÚDO PRINCIPAL --- */
        .container {
            padding: 0;
            max-width: 100%;
            margin: 0;
            flex-grow: 1;
        }

        .section {
            background-color: var(--card-color);
            padding: 20px 16px;
            border-radius: var(--border-radius);
            margin: 0 0 24px 0;
        }

        .shopping-list-section {
            padding: 0;
            border-radius: 0;
        }

        .shopping-list-section .section-header { padding: 20px 16px 16px 16px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-header h2 { margin: 0; font-size: 1.5rem; color: var(--primary-color); }
        .section-header .clear-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 1.2rem; transition: color 0.3s; padding: 5px; }
        .section-header .clear-btn:hover { color: #ff7961; }

        /* --- LAYOUT DE ABAS DE NAVEGADOR --- */
        .tabs-nav {
            display: flex;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--input-bg-color);
            padding: 0 8px;
            gap: 4px;
            margin-top: 10px;
        }
        .tab-btn {
            background: #1a1a1a;
            color: var(--secondary-text-color);
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover {
            background: #252525;
            color: var(--text-color);
        }
        .tab-btn.active {
            background-color: var(--card-color);
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }
        .tab-content {
            display: none;
            background-color: var(--card-color);
            padding: 20px 16px;
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            margin-bottom: 24px;
        }
        .tab-content.active {
            display: block;
        }
        .tab-content h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.4rem;
            color: var(--primary-color);
        }

        /* --- BOTÕES --- */
        .custom-btn { background-color: var(--primary-color); color: var(--bg-color); border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; padding: 10px 15px; transition: background-color 0.3s; }
        .custom-btn:hover { background-color: #ffd54f; }
        .custom-btn.secondary { background-color: var(--input-bg-color); color: var(--text-color); }
        .custom-btn.secondary:hover { background-color: #555; }
        .button-group { display: flex; gap: 10px; }
        .button-group .custom-btn, .button-group a { border-radius: 8px; }

        /* --- TABELA E PREÇOS --- */
        .table-scroll-wrapper { overflow-x: auto; width: 100%; }
        .shopping-list-table { width: auto; min-width: 100%; border-collapse: collapse; table-layout: fixed; }
        .shopping-list-table th, .shopping-list-table td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #4a4a4a; vertical-align: middle; }
        .shopping-list-table th { font-size: 0.8rem; color: var(--secondary-text-color); text-transform: uppercase; }
        .shopping-list-table th:first-child, .shopping-list-table td:first-child { padding-left: 16px; }
        .shopping-list-table th:last-child, .shopping-list-table td:last-child { padding-right: 16px; }
        .price-cell { padding: 0 !important; width: 80px; text-align: right; }
        .price-cell input { width: 100%; padding: 12px 8px; text-align: right; background-color: var(--card-color); color: var(--text-color); border: none; border-radius: 0 !important; }
        .price-cell input.default-price { color: var(--secondary-text-color) !important; }
        .price-cell:first-of-type { border-right: 1px solid var(--input-bg-color); }
        .item-name-input { width: 100%; background: none; border: none; color: var(--text-color); font-size: 1rem; font-family: inherit; padding: 4px 0; border-radius: 4px; resize: none; overflow-y: hidden; line-height: 1.4; transition: all 0.2s ease-in-out; }
        .item-name-input:focus { outline: none; background-color: var(--input-bg-color); }
        .shopping-list-table .action-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 1.2rem; transition: color 0.3s; padding: 0; }
        .shopping-list-table .action-btn:hover { color: #ff7961; }
        .shopping-list-table .action-btn.add { color: var(--green-highlight); }
        .shopping-list-table .action-btn.add:hover { color: #81c784; }
        .cheapest-price { color: var(--green-highlight) !important; font-weight: bold; }
        .cheapest-price::before { content: "✔ "; }
        .equal-price { color: var(--primary-color) !important; font-weight: bold; }
        .shopping-list-table td input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .purchased .item-name-input, .purchased input[type="text"] { text-decoration: line-through; color: var(--secondary-text-color); }

        /* --- SEÇÃO DO EMBED --- */
        .iframe-container { position: relative; border-radius: var(--border-radius); overflow: hidden; padding-top: 200%; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        #iframe-overlay, #iframe-overlay-2 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; flex-direction: column; gap: 15px; z-index: 5; color: var(--text-color); text-align: center; }
        .loader { border: 4px solid var(--input-bg-color); border-top: 4px solid var(--primary-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .footer { text-align: center; padding: 16px; color: var(--secondary-text-color); font-size: 0.875rem; background-color: #282828; margin-top: auto; width: 100%; }

        #sync-status-indicator { width: 12px; height: 12px; border-radius: 50%; background-color: var(--green-highlight); z-index: 11; transition: background-color 0.5s ease; flex-shrink: 0; }

        .header-right { display: flex; align-items: center; gap: 15px; }
        #username-display { color: var(--secondary-text-color); font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }

        #sync-status-indicator.status-syncing { background-color: var(--yellow-sync-color); }
        #sync-status-indicator.status-error { background-color: var(--danger-color); }
        #sync-status-indicator.status-saved { background-color: var(--green-highlight); }
        #sync-status-indicator.status-offline { background-color: #7986cb; }

        /* --- Autocomplete --- */
        #autocomplete-suggestions {
            position: absolute;
            background-color: var(--input-bg-color);
            border: 1px solid var(--primary-color);
            border-top: none;
            border-radius: 0 0 8px 8px;
            z-index: 1002;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .suggestion-item {
            padding: 8px 10px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #666;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background-color: #555; }

        @media (min-width: 768px) { .shopping-list-table colgroup col:nth-child(2) { width: 450px; } }
        @media (min-width: 1024px) { .shopping-list-table colgroup col:nth-child(2) { width: 550px; } }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-box">
            <h2><i class="fas fa-lock"></i> Acesso Secure</h2>
            <input type="text" id="username" class="auth-input" placeholder="Nome de usuário" autocomplete="username">
            <div class="password-container">
                <input type="password" id="password" class="auth-input" placeholder="Senha" autocomplete="current-password">
                <i class="fas fa-eye" id="togglePassword"></i>
            </div>
            <div class="auth-buttons">
                <button class="custom-btn" onclick="handleLogin()">Entrar</button>
                <button class="custom-btn secondary" onclick="handleRegister()">Cadastrar</button>
            </div>
            <p id="auth-message"></p>
        </div>
    </div>

    <div id="app-container">
        <div id="side-menu" class="side-menu">
            <a href="javascript:void(0)" class="close-btn" onclick="closeNav()">&times;</a>
            <a href="#"><i class="fas fa-list-check"></i> Minha Lista</a>
            <a href="itens"><i class="fas fa-archive"></i> Lista de Itens</a>
            <a href="#"><i class="fas fa-history"></i> Histórico</a>
            <a href="#"><i class="fas fa-tags"></i> Ofertas</a>
            <a href="javascript:void(0)" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Sair</a>
        </div>
        <div id="page-overlay" onclick="closeNav()"></div>

        <div id="main-content-wrapper">
            <div class="header">
                <span class="menu-icon" onclick="openNav()">&#9776;</span>
                <span class="title">
                    <img src="01.png" alt="Ícone">
                    Meu Mercado
                </span>

                <div class="header-right">
                    <span id="username-display"></span>
                    <div id="sync-status-indicator"></div>
                </div>
            </div>

            <div class="container">
                <div class="section shopping-list-section">
                    <div class="section-header">
                        <h2>Meus Itens</h2>
                        <button class="clear-btn" onclick="clearList()" title="Limpar toda a lista">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>

                    <div class="table-scroll-wrapper">
                        <table class="shopping-list-table">
                            <colgroup>
                                <col style="width: 40px;"> <col style="width: 250px;"> <col style="width: 80px;"> <col style="width: 80px;"> <col style="width: 45px;"> 
                            </colgroup>
                            <thead>
                                <tr>
                                    <th><i class="fas fa-check"></i></th>
                                    <th>Item</th>
                                    <th>Shibata</th>
                                    <th>Nagumo</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="shopping-list-body"></tbody>
                        </table>
                    </div>
                </div>

                <div class="tabs-nav">
                    <button class="tab-btn active" onclick="switchTab('comparator-section')">
                        <i class="fas fa-balance-scale"></i> Comparador de Preços
                    </button>
                    <button class="tab-btn" onclick="switchTab('comparator-section-2')">
                        <i class="fas fa-search"></i> Busca Preço Auto
                    </button>
                </div>

                <div class="tab-content active" id="comparator-section">
                    <h2>Comparador de Preços</h2>
                    <div id="iframe-wrapper" class="iframe-container">
                        <div id="iframe-overlay">
                            <div class="loader"></div>
                            <span>Acordando o comparador...</span>
                        </div>
                        <iframe id="streamlit-app" src="https://precosmercados.streamlit.app/?embed=true&minimal=true"></iframe>
                    </div>
                       
                    <div class="button-group" style="margin-top: 16px;">
                        <button class="custom-btn" onclick="wakeUpApp()" style="flex-grow: 1;">
                            <i class="fas fa-sync-alt"></i> Ativar / Atualizar
                        </button>
                        <a href="https://precosmercados.streamlit.app/" target="_blank" rel="noopener noreferrer" class="custom-btn secondary" style="flex-grow: 1; text-align: center; text-decoration: none; line-height: 1.8;">
                            <i class="fas fa-external-link-alt"></i> Abrir em Nova Guia
                        </a>
                    </div>
                </div>

                <div class="tab-content" id="comparator-section-2">
                    <h2>Busca Preço Auto</h2>
                    <div id="iframe-wrapper-2" class="iframe-container">
                        <div id="iframe-overlay-2">
                            <div class="loader"></div>
                            <span>Acordando o comparador...</span>
                        </div>
                        <iframe id="streamlit-app-2" src="https://buscaprecoauto.streamlit.app/?embed=true&minimal=true"></iframe>
                    </div>
                    <div class="button-group" style="margin-top: 16px;">
                        <button class="custom-btn" onclick="wakeUpApp2()" style="flex-grow: 1;">
                            <i class="fas fa-sync-alt"></i> Ativar / Atualizar
                        </button>
                        <a href="https://buscaprecoauto.streamlit.app/" target="_blank" rel="noopener noreferrer" class="custom-btn secondary" style="flex-grow: 1; text-align: center; text-decoration: none; line-height: 1.8;">
                            <i class="fas fa-external-link-alt"></i> Abrir em Nova Guia
                        </a>
                    </div>
                </div>
            </div>

            <footer class="footer">
                Feito para facilitar suas compras. 🛒💡
            </footer>
        </div>
    </div>

    <div id="autocomplete-suggestions"></div>

    <script>
        // --- CONSTANTE DA API DE ITENS ---
        const WORKER_URL = '/api/shopping-list';

        // --- GERENCIAMENTO DE AUTENTICAÇÃO ---
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const authMessage = document.getElementById('auth-message');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        passwordInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                handleLogin();
            }
        });

        function showApp() {
            authContainer.style.display = 'none';
            appContainer.style.display = 'block';
            const username = localStorage.getItem('currentUser');
            const usernameDisplay = document.getElementById('username-display');
            if (username && usernameDisplay) {
                usernameDisplay.innerHTML = `<i class="fas fa-user"></i> ${username}`;
            }

            loadList();
            startPolling();
        }

        function showAuth(message = '', isError = false) {
            authContainer.style.display = 'flex';
            appContainer.style.display = 'none';
            authMessage.textContent = message;
            authMessage.style.color = isError ? 'var(--danger-color)' : 'var(--green-highlight)';
        }

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                showAuth('Por favor, preencha usuário e senha.', true);
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Erro ao fazer login.');
                }

                localStorage.setItem('authToken', data.token);
                localStorage.setItem('currentUser', username);
                showApp();
            } catch (error) {
                showAuth(error.message, true);
            }
        }

        async function handleRegister() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                showAuth('Por favor, preencha usuário e senha para cadastrar.', true);
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                 if (!response.ok) {
                    throw new Error(data.message || 'Erro ao cadastrar.');
                }
                showAuth(data.message, false);
            } catch (error) {
                 showAuth(error.message, true);
            }
        }

        async function handleLogout() {
            stopPolling();
            const token = localStorage.getItem('authToken');
            if (token) {
                try {
                    await fetch('/api/logout', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                } catch (error) {
                    console.error("Logout failed, but proceeding.", error);
                }
            }
            localStorage.removeItem('authToken');
            const username = localStorage.getItem('currentUser');
            if (username) {
                 localStorage.removeItem(`shoppingList_${username}`);
                 localStorage.removeItem(`offlineList_${username}`);
                 localStorage.removeItem(`pendingDeletes_${username}`);
            }
            localStorage.removeItem('currentUser');
            location.reload();
        }

        function getAuthHeaders() {
            const token = localStorage.getItem('authToken');
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function openNav() { document.getElementById("side-menu").classList.add('open'); document.getElementById("page-overlay").classList.add('show'); }
        function closeNav() { document.getElementById("side-menu").classList.remove('open'); document.getElementById("page-overlay").classList.remove('show'); }
        document.addEventListener('keydown', (event) => { if (event.key === "Escape") closeNav(); });

        // --- INTERFACE DE ABAS ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            const activeBtn = document.querySelector(`.tab-btn[onclick*="${tabId}"]`);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById(tabId).classList.add('active');
        }

        // --- VARIÁVEIS DE ESTADO E SYNC ---
        const tableBody = document.getElementById('shopping-list-body');
        const statusIndicator = document.getElementById('sync-status-indicator');
        const autocompleteSuggestions = document.getElementById('autocomplete-suggestions');
        let saveTimeout;
        let syncState = 'saved';
        let isOnline = navigator.onLine;
        let pollingIntervalId = null;

        let itensList = [];
        async function carregarItens() {
            try {
                const response = await fetch(WORKER_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                itensList = await response.json();
            } catch (error) {
                console.error('Falha ao carregar lista de itens da API:', error);
                itensList = [];
            }
        }

        let currentActiveInput = null;

        function normalizeString(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        function setSyncStatus(newState) {
            syncState = newState;
            statusIndicator.className = `status-${newState}`;
            if (newState === 'error') {
                setTimeout(() => { if (syncState === 'error') setSyncStatus('offline'); }, 3000);
            }
        }

        function stopPolling() {
            if (pollingIntervalId) {
                clearInterval(pollingIntervalId);
                pollingIntervalId = null;
            }
        }

        function startPolling() {
            stopPolling();
            pollingIntervalId = setInterval(pollForChanges, 4000);
        }

        async function pollForChanges() {
            const activeEl = document.activeElement;
            if (!isOnline || document.hidden || syncState === 'syncing' || (activeEl && ['INPUT', 'TEXTAREA'].includes(activeEl.tagName) && tableBody.contains(activeEl))) {
                return;
            }

            try {
                const response = await fetch('/api/list', { headers: getAuthHeaders() });
                if (response.status === 401) return handleLogout();
                if (!response.ok) return;

                const remoteItems = await response.json();
                const localItems = getCurrentLocalItems();
                if (JSON.stringify(remoteItems) !== JSON.stringify(localItems)) {
                    redrawTable(remoteItems, false);
                }
            } catch (error) {
                // Silencioso
            }
        }

        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }

        function getCurrentLocalItems() {
            const items = [];
            document.querySelectorAll('#shopping-list-body tr:not(.add-item-row)').forEach(row => {
                const name = row.cells[1].querySelector('textarea').value.trim();
                if (name) {
                    items.push({
                        id: row.dataset.id ? parseInt(row.dataset.id) : null,
                        name: name,
                        priceShibata: row.cells[2].querySelector('input').value || 'R$ 0,00',
                        priceNagumo: row.cells[3].querySelector('input').value || 'R$ 0,00',
                        purchased: row.classList.contains('purchased')
                    });
                }
            });
            return items;
        }

        async function saveList() {
            const items = getCurrentLocalItems();
            const username = localStorage.getItem('currentUser');
            if (!username) return;

            const pendingDeletes = JSON.parse(localStorage.getItem(`pendingDeletes_${username}`) || '[]');
            if (!isOnline) {
                setSyncStatus('offline');
                localStorage.setItem(`offlineList_${username}`, JSON.stringify(items));
                return;
            }

            setSyncStatus('syncing'); 
            await saveListOnline(items, pendingDeletes);
        }

        async function saveListOnline(items, deletes = []) {
            const username = localStorage.getItem('currentUser');
            if (!username) return;

            try {
                const response = await fetch('/api/list', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ items: items, deletes: deletes })
                });
                if (response.status === 401) return handleLogout();
                if (!response.ok) throw new Error('Falha ao salvar no servidor.');
                const mergedItems = await response.json();
                setSyncStatus('saved');

                localStorage.setItem(`shoppingList_${username}`, JSON.stringify(mergedItems));
                localStorage.removeItem(`offlineList_${username}`);
                localStorage.removeItem(`pendingDeletes_${username}`);

                const activeEl = document.activeElement;
                const isTypingInTable = activeEl && ['INPUT', 'TEXTAREA'].includes(activeEl.tagName) && tableBody.contains(activeEl);
                if (!isTypingInTable) {
                    redrawTable(mergedItems, false);
                }
            } catch (error) {
                setSyncStatus('error');
                console.error("Erro ao salvar online:", error);
            }
        }

        function triggerDelayedSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveList, 1500);
        }

        // --- ENGENHARIA DE PREÇOS E FORMATATAÇÃO ---
        function parsePrice(val) {
            if (!val) return 0;
            let clean = val.replace(/[^\d,.-]/g, '').replace(',', '.');
            let num = parseFloat(clean);
            return isNaN(num) ? 0 : num;
        }

        function formatCurrency(num) {
            return 'R$ ' + num.toFixed(2).replace('.', ',');
        }

        function applyPriceFormatting(row) {
            const shibataInput = row.cells[2].querySelector('input');
            const nagumoInput = row.cells[3].querySelector('input');

            let pShibata = parsePrice(shibataInput.value);
            let pNagumo = parsePrice(nagumoInput.value);

            shibataInput.classList.remove('cheapest-price', 'equal-price');
            nagumoInput.classList.remove('cheapest-price', 'equal-price');

            if (pShibata > 0 || pNagumo > 0) {
                if (pShibata > 0 && pNagumo > 0) {
                    if (pShibata < pNagumo) {
                        shibataInput.classList.add('cheapest-price');
                    } else if (pNagumo < pShibata) {
                        nagumoInput.classList.add('cheapest-price');
                    } else {
                        shibataInput.classList.add('equal-price');
                        nagumoInput.classList.add('equal-price');
                    }
                } else if (pShibata > 0) {
                    shibataInput.classList.add('cheapest-price');
                } else if (pNagumo > 0) {
                    nagumoInput.classList.add('cheapest-price');
                }
            }
        }

        function formatPriceInput(input) {
            let value = input.value.replace(/\D/g, '');
            if (value === '' || parseInt(value) === 0) {
                input.value = '';
                input.classList.add('default-price');
            } else {
                let num = parseInt(value) / 100;
                input.value = formatCurrency(num);
                input.classList.remove('default-price');
            }
        }

        // --- REDRAW DA TABELA ---
        function redrawTable(items, isInitialLoad = false) {
            const focusedElementId = document.activeElement ? document.activeElement.id : null;
            const focusedRowIndex = document.activeElement && document.activeElement.closest('tr') ? document.activeElement.closest('tr').rowIndex : -1;
            const focusedCellIndex = document.activeElement && document.activeElement.closest('td') ? document.activeElement.closest('td').cellIndex : -1;
            const selectionStart = document.activeElement ? document.activeElement.selectionStart : null;
            const selectionEnd = document.activeElement ? document.activeElement.selectionEnd : null;

            tableBody.innerHTML = '';

            items.forEach(item => {
                const row = createRow(item);
                tableBody.appendChild(row);
                applyPriceFormatting(row);
            });

            appendAddRow();

            if (focusedRowIndex !== -1 && focusedCellIndex !== -1) {
                const targetRow = tableBody.rows[focusedRowIndex - 1];
                if (targetRow) {
                    const targetCell = targetRow.cells[focusedCellIndex];
                    if (targetCell) {
                        const input = targetCell.querySelector('input, textarea');
                        if (input) {
                            input.focus();
                            if (selectionStart !== null && selectionEnd !== null && typeof input.setSelectionRange === 'function') {
                                try { input.setSelectionRange(selectionStart, selectionEnd); } catch(e){}
                            }
                        }
                    }
                }
            }
        }

        function createRow(item) {
            const tr = document.createElement('tr');
            tr.dataset.id = item.id;
            if (item.purchased) tr.classList.add('purchased');

            // Checkbox
            const tdCheck = document.createElement('td');
            const chk = document.createElement('input');
            chk.type = 'checkbox';
            chk.checked = item.purchased;
            chk.addEventListener('change', function() {
                tr.classList.toggle('purchased', this.checked);
                saveList();
            });
            tdCheck.appendChild(chk);
            tr.appendChild(tdCheck);

            // Nome do Item
            const tdName = document.createElement('td');
            const txt = document.createElement('textarea');
            txt.className = 'item-name-input';
            txt.rows = 1;
            txt.value = item.name;
            txt.addEventListener('input', function() {
                autoResizeTextarea(this);
                showAutocomplete(this);
                triggerDelayedSave();
            });
            txt.addEventListener('focus', function() { currentActiveInput = this; });
            txt.addEventListener('blur', () => setTimeout(hideAutocomplete, 200));
            tdName.appendChild(txt);
            tr.appendChild(tdName);
            setTimeout(() => autoResizeTextarea(txt), 0);

            // Preço Shibata
            const tdShibata = document.createElement('td');
            tdShibata.className = 'price-cell';
            const inShibata = document.createElement('input');
            inShibata.type = 'text';
            inShibata.inputMode = 'numeric';
            inShibata.value = (item.priceShibata && item.priceShibata !== 'R$ 0,00') ? item.priceShibata : '';
            if (!inShibata.value) inShibata.classList.add('default-price');
            inShibata.addEventListener('input', function() { formatPriceInput(this); applyPriceFormatting(tr); triggerDelayedSave(); });
            tdShibata.appendChild(inShibata);
            tr.appendChild(tdShibata);

            // Preço Nagumo
            const tdNagumo = document.createElement('td');
            tdNagumo.className = 'price-cell';
            const inNagumo = document.createElement('input');
            inNagumo.type = 'text';
            inNagumo.inputMode = 'numeric';
            inNagumo.value = (item.priceNagumo && item.priceNagumo !== 'R$ 0,00') ? item.priceNagumo : '';
            if (!inNagumo.value) inNagumo.classList.add('default-price');
            inNagumo.addEventListener('input', function() { formatPriceInput(this); applyPriceFormatting(tr); triggerDelayedSave(); });
            tdNagumo.appendChild(inNagumo);
            tr.appendChild(tdNagumo);

            // Deletar
            const tdDel = document.createElement('td');
            const btnDel = document.createElement('button');
            btnDel.className = 'action-btn';
            btnDel.innerHTML = '<i class="fas fa-times"></i>';
            btnDel.addEventListener('click', function() {
                if (item.id) {
                    const username = localStorage.getItem('currentUser');
                    const pendingDeletes = JSON.parse(localStorage.getItem(`pendingDeletes_${username}`) || '[]');
                    pendingDeletes.push(item.id);
                    localStorage.setItem(`pendingDeletes_${username}`, JSON.stringify(pendingDeletes));
                }
                tr.remove();
                saveList();
            });
            tdDel.appendChild(btnDel);
            tr.appendChild(tdDel);

            return tr;
        }

        function appendAddRow() {
            const tr = document.createElement('tr');
            tr.className = 'add-item-row';

            tr.appendChild(document.createElement('td'));

            const tdName = document.createElement('td');
            const txt = document.createElement('textarea');
            txt.className = 'item-name-input';
            txt.placeholder = 'Adicionar novo item...';
            txt.rows = 1;
            txt.addEventListener('input', function() {
                autoResizeTextarea(this);
                showAutocomplete(this);
            });
            txt.addEventListener('focus', function() { currentActiveInput = this; });
            txt.addEventListener('blur', () => setTimeout(hideAutocomplete, 200));
            txt.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addNewItemFromRow(tr, txt.value);
                }
            });
            tdName.appendChild(txt);
            tr.appendChild(tdName);

            const tdS = document.createElement('td'); tdS.className = 'price-cell';
            const inS = document.createElement('input'); inS.type = 'text'; inS.disabled = true; inS.classList.add('default-price');
            tdS.appendChild(inS); tr.appendChild(tdS);

            const tdN = document.createElement('td'); tdN.className = 'price-cell';
            const inN = document.createElement('input'); inN.type = 'text'; inN.disabled = true; inN.classList.add('default-price');
            tdN.appendChild(inN); tr.appendChild(tdN);

            const tdAdd = document.createElement('td');
            const btnAdd = document.createElement('button');
            btnAdd.className = 'action-btn add';
            btnAdd.innerHTML = '<i class="fas fa-plus"></i>';
            btnAdd.addEventListener('click', () => addNewItemFromRow(tr, txt.value));
            tdAdd.appendChild(btnAdd);
            tr.appendChild(tdAdd);

            tableBody.appendChild(tr);
        }

        function addNewItemFromRow(row, name) {
            if (!name.trim()) return;
            const newItem = { id: Date.now(), name: name.trim(), priceShibata: '', priceNagumo: '', purchased: false };
            const newRow = createRow(newItem);
            tableBody.insertBefore(newRow, row);
            row.querySelector('textarea').value = '';
            row.querySelector('textarea').style.height = 'auto';
            saveList();
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // --- AUTOCOMPLETE ---
        function showAutocomplete(input) {
            const query = normalizeString(input.value.trim());
            if (!query) { hideAutocomplete(); return; }

            const filtered = itensList.filter(item => normalizeString(item.nome).includes(query)).slice(0, 5);
            if (filtered.length === 0) { hideAutocomplete(); return; }

            autocompleteSuggestions.innerHTML = '';
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `<i class="fas fa-shopping-basket" style="color: var(--primary-color);"></i> <span>${item.nome}</span>`;
                div.addEventListener('click', () => {
                    input.value = item.nome;
                    autoResizeTextarea(input);
                    hideAutocomplete();
                    const row = input.closest('tr');
                    if (row.classList.contains('add-item-row')) {
                        addNewItemFromRow(row, item.nome);
                    } else {
                        saveList();
                    }
                });
                autocompleteSuggestions.appendChild(div);
            });

            const rect = input.getBoundingClientRect();
            autocompleteSuggestions.style.top = `${rect.bottom + window.scrollY}px`;
            autocompleteSuggestions.style.left = `${rect.left + window.scrollX}px`;
            autocompleteSuggestions.style.width = `${rect.width}px`;
            autocompleteSuggestions.style.display = 'block';
        }

        function hideAutocomplete() {
            autocompleteSuggestions.style.display = 'none';
        }

        function clearList() {
            if (confirm("Tem certeza que deseja apagar TODOS os itens da lista?")) {
                const username = localStorage.getItem('currentUser');
                if (username) {
                    const localItems = getCurrentLocalItems();
                    const allIds = localItems.map(i => i.id).filter(id => id !== null);
                    localStorage.setItem(`pendingDeletes_${username}`, JSON.stringify(allIds));
                }
                tableBody.innerHTML = '';
                appendAddRow();
                saveList();
            }
        }

        function loadList() {
            const username = localStorage.getItem('currentUser');
            if (!username) return;

            const cached = localStorage.getItem(`shoppingList_${username}`);
            const offline = localStorage.getItem(`offlineList_${username}`);

            if (offline) {
                redrawTable(JSON.parse(offline), true);
            } else if (cached) {
                redrawTable(JSON.parse(cached), true);
            } else {
                appendAddRow();
            }
        }

        // --- IFRAMES WAKEUP ---
        function wakeUpApp() {
            const overlay = document.getElementById('iframe-overlay');
            overlay.style.display = 'flex';
            const iframe = document.getElementById('streamlit-app');
            iframe.src = iframe.src;
            setTimeout(() => overlay.style.display = 'none', 4000);
        }

        function wakeUpApp2() {
            const overlay = document.getElementById('iframe-overlay-2');
            overlay.style.display = 'flex';
            const iframe = document.getElementById('streamlit-app-2');
            iframe.src = iframe.src;
            setTimeout(() => overlay.style.display = 'none', 4000);
        }

        // --- MONITOR DE REDE ---
        window.addEventListener('online', () => { isOnline = true; saveList(); startPolling(); });
        window.addEventListener('offline', () => { isOnline = false; setSyncStatus('offline'); stopPolling(); });

        // --- INICIALIZAÇÃO ---
        document.addEventListener('DOMContentLoaded', async () => {
            await carregarItens();

            if (localStorage.getItem('authToken')) {
                showApp();
            } else {
                showAuth();
            }

            const username = localStorage.getItem('currentUser');
            let hasPending = false;
            if (username) {
                const pendingItems = localStorage.getItem(`offlineList_${username}`);
                const pendingDeletes = localStorage.getItem(`pendingDeletes_${username}`);
                if (pendingItems || (pendingDeletes && pendingDeletes !== '[]')) {
                    hasPending = true;
                }
            }

            if (!isOnline || hasPending) {
                setSyncStatus('offline');
            } else {
                setSyncStatus('saved');
            }
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker registrado:', reg.scope))
                    .catch(err => console.log('Falha ServiceWorker:', err));
            });
        }
    </script>
</body>
