<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mercado</title>

    <script>
        // OTIMIZAÇÃO: roda ANTES do primeiro paint (script bloqueante no <head>).
        // Se já existe token salvo, marca <html> com "logged-in" imediatamente,
        // para o CSS já nascer mostrando o app e escondendo a tela de
        // "Acesso Seguro" — eliminando o flash da tela de login a cada
        // abertura do site quando o usuário já está logado.
        if (localStorage.getItem('authToken')) {
            document.documentElement.classList.add('logged-in');
        }
    </script>

    <meta property="og:title" content="Meu Mercado" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Sua lista de compras inteligente com comparador de preços e otimização." />
    <meta property="og:image" content="https://meumercado.pages.dev/01.png" />


    <link rel="icon" href="01.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --bg-color: #212121;
            --card-color: #2c2c2c;
            --text-color: #f0f0f0;
            --secondary-text-color: #a0a0a0;
            --primary-color: #ffc107;
            --green-highlight: #4CAF50;
            --danger-color: #f44336;
            --yellow-sync-color: #ffc107;
            --border-radius: 12px;
            --input-bg-color: #383838;
            --menu-width: 250px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- TELA DE LOGIN --- */
        #auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-box {
            background-color: var(--card-color);
            padding: 30px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .auth-box h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
        }
        .auth-input {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg-color);
            border: 1px solid #444;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 15px;
        }
        .password-container {
            position: relative;
            margin-bottom: 15px;
        }
        .password-container .auth-input {
            margin-bottom: 0;
            padding-right: 40px; /* Espaço para o ícone */
        }
        #togglePassword {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--secondary-text-color);
        }
        .auth-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .auth-buttons .custom-btn {
            flex-grow: 1;
        }
        #auth-message {
            color: var(--danger-color);
            min-height: 20px;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        /* Ocultar app-container por padrão */
        #app-container {
            display: none;
        }

        /* OTIMIZAÇÃO: quando o <html> já nasce com a classe "logged-in"
           (definida pelo script bloqueante no <head>, antes do paint),
           inverte os displays direto no CSS, sem esperar nenhum JS do
           final da página rodar. Isso é o que elimina o flash da tela
           de login para quem já está autenticado. */
        html.logged-in #auth-container {
            display: none;
        }
        html.logged-in #app-container {
            display: block;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--input-bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--bg-color);
        }
        .header .title img {
            height: 30px;
            width: auto;
            margin-right: 10px;
            border-radius: 5px;
        }
        .header .menu-icon { font-size: 1.5rem; cursor: pointer; color: var(--primary-color); padding: 5px; }
        .header .title { font-size: 1.25rem; font-weight: bold; display: flex; align-items: center; white-space: nowrap; position: absolute; left: 50%; transform: translateX(-50%); }
        .header .title i { margin-right: 8px; color: var(--primary-color); }

        /* --- SIDE MENU & OVERLAY --- */
        .side-menu { height: 100%; width: 0; position: fixed; z-index: 1001; top: 0; left: 0; background-color: var(--card-color); overflow-x: hidden; transition: 0.3s; padding-top: 60px; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        .side-menu.open { width: var(--menu-width); }
        .side-menu .close-btn { position: absolute; top: 15px; right: 25px; font-size: 2rem; color: var(--primary-color); cursor: pointer; line-height: 1; }
        .side-menu a { padding: 15px 20px; text-decoration: none; font-size: 1.1rem; color: var(--text-color); display: block; transition: 0.3s; border-bottom: 1px solid var(--input-bg-color); }
        .side-menu a:hover { background-color: #575757; color: var(--primary-color); }
        .side-menu a i { color: var(--primary-color); width: 20px; text-align: center; margin-right: 10px; }
        #page-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; display: none; transition: opacity 0.3s; }
        #page-overlay.show { display: block; }

        /* --- CONTEÚDO PRINCIPAL --- */
        .container {
            padding: 0;
            max-width: 100%;
            margin: 0;
            flex-grow: 1;
        }

        .section {
            background-color: var(--card-color);
            padding: 20px 16px;
            border-radius: var(--border-radius);
            margin: 0 0 24px 0;
        }

        .shopping-list-section {
            padding: 0;
            border-radius: 0;
        }

        .shopping-list-section .section-header { padding: 20px 16px 16px 16px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-header h2 { margin: 0; font-size: 1.5rem; color: var(--primary-color); }
        .section-header .clear-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 1.2rem; transition: color 0.3s; padding: 5px; }
        .section-header .clear-btn:hover { color: #ff7961; }

        /* --- BOTÕES --- */
        .custom-btn { background-color: var(--primary-color); color: var(--bg-color); border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; padding: 10px 15px; transition: background-color 0.3s; }
        .custom-btn:hover { background-color: #ffd54f; }
        .custom-btn.secondary { background-color: var(--input-bg-color); color: var(--text-color); }
        .custom-btn.secondary:hover { background-color: #555; }
        .button-group { display: flex; gap: 10px; }
        .button-group .custom-btn, .button-group a { border-radius: 8px; }

        /* --- TABELA E PREÇOS --- */
        .table-scroll-wrapper { overflow-x: auto; width: 100%; }
        .shopping-list-table { width: auto; min-width: 100%; border-collapse: collapse; table-layout: fixed; }
        .shopping-list-table th, .shopping-list-table td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #4a4a4a; vertical-align: middle; }
        .shopping-list-table th { font-size: 0.8rem; color: var(--secondary-text-color); text-transform: uppercase; }
        .shopping-list-table th:first-child, .shopping-list-table td:first-child { padding-left: 16px; }
        .shopping-list-table th:last-child, .shopping-list-table td:last-child { padding-right: 16px; }
        .price-cell { padding: 0 !important; width: 80px; text-align: right; }
        .price-cell input { width: 100%; padding: 12px 8px; text-align: right; background-color: var(--card-color); color: var(--text-color); border: none; border-radius: 0 !important; }
        .price-cell input.default-price { color: var(--secondary-text-color) !important; }
        .price-cell:first-of-type { border-right: 1px solid var(--input-bg-color); }
        .item-name-input { width: 100%; background: none; border: none; color: var(--text-color); font-size: 1rem; font-family: inherit; padding: 4px 0; border-radius: 4px; resize: none; overflow-y: hidden; line-height: 1.4; transition: all 0.2s ease-in-out; }
        .item-name-input:focus { outline: none; background-color: var(--input-bg-color); }
        .shopping-list-table .action-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 1.2rem; transition: color 0.3s; padding: 0; }
        .shopping-list-table .action-btn:hover { color: #ff7961; }
        .shopping-list-table .action-btn.add { color: var(--green-highlight); }
        .shopping-list-table .action-btn.add:hover { color: #81c784; }
        .cheapest-price { color: var(--green-highlight) !important; font-weight: bold; }
        .cheapest-price::before { content: "✔ "; }
        .equal-price { color: var(--primary-color) !important; font-weight: bold; }
        .shopping-list-table td input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .purchased .item-name-input, .purchased input[type="text"] { text-decoration: line-through; color: var(--secondary-text-color); }

        /* --- SEÇÃO DO EMBED --- */
        .iframe-container { position: relative; border-radius: var(--border-radius); overflow: hidden; padding-top: 175%; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        #iframe-overlay, #iframe-overlay-2 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; flex-direction: column; gap: 15px; z-index: 5; color: var(--text-color); text-align: center; }
        .loader { border: 4px solid var(--input-bg-color); border-top: 4px solid var(--primary-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* --- ABAS (TABS) --- */
        .tabs-wrapper {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .tabs-nav {
            display: flex;
            background-color: #1a1a1a;
            border-bottom: 2px solid var(--input-bg-color);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs-nav::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex: 1;
            padding: 13px 16px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            color: var(--secondary-text-color);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.2s, border-color 0.2s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .tab-btn:hover {
            color: var(--text-color);
            background-color: #252525;
        }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background-color: var(--card-color);
        }
        .tab-btn i { font-size: 0.85rem; }
        .tab-panel {
            display: none;
            padding: 20px 16px;
        }
        .tab-panel.active {
            display: block;
        }

        .tab-toggle-btn {
            flex: 0 0 44px;
            border-right: 1px solid var(--input-bg-color);
            color: var(--secondary-text-color) !important;
            transition: color 0.2s, background-color 0.2s;
        }
        .tab-toggle-btn:hover { color: var(--primary-color) !important; }
        .tabs-wrapper.collapsed .tab-panel { display: none !important; }
        .tabs-wrapper.collapsed .tab-toggle-btn i { transform: rotate(180deg); }
        .tab-toggle-btn i { transition: transform 0.25s ease; }
        .manager-section-title {
            margin: 0 0 12px 0;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .manager-divider {
            border: none;
            border-top: 1px solid var(--input-bg-color);
            margin: 24px 0;
        }
        .manager-remove-btn {
            color: var(--danger-color) !important;
            border: 1px solid var(--danger-color) !important;
        }
        .manager-remove-btn:hover {
            background-color: var(--danger-color) !important;
            color: #fff !important;
        }
        .manager-form { display: flex; flex-direction: column; gap: 12px; }
        .manager-select { width: 100%; padding: 12px; background-color: var(--input-bg-color); border: 1px solid #444; border-radius: 8px; color: var(--text-color); font-size: 1rem; }
        /* Autocomplete dropdown */
        .manager-autocomplete-wrapper { position: relative; }
        .manager-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0; right: 0;
            background-color: var(--input-bg-color);
            border: 1px solid #555;
            border-radius: var(--border-radius);
            list-style: none;
            margin: 0; padding: 0;
            z-index: 999;
            max-height: min(35vh, 130px);
            overflow-y: auto;
            display: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .manager-dropdown.open { display: block; }
        .manager-dropdown li {
            padding: 11px 14px;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-color);
            border-bottom: 1px solid #3a3a3a;
            transition: background-color 0.15s;
        }
        .manager-dropdown li:last-child { border-bottom: none; }
        .manager-dropdown li:hover, .manager-dropdown li.active { background-color: rgba(255,193,7,0.15); }
        .manager-dropdown li mark { background: transparent; color: var(--primary-color); font-weight: 700; }
        .footer { text-align: center; padding: 16px; color: var(--secondary-text-color); font-size: 0.875rem; background-color: #282828; margin-top: auto; width: 100%; }

        #sync-status-indicator { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            background-color: var(--green-highlight); 
            z-index: 11; 
            transition: background-color 0.5s ease; 
            flex-shrink: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #username-display {
            color: var(--secondary-text-color);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #sync-status-indicator.status-syncing { background-color: var(--yellow-sync-color); }
        #sync-status-indicator.status-error { background-color: var(--danger-color); }
        #sync-status-indicator.status-saved { background-color: var(--green-highlight); }
        #sync-status-indicator.status-offline { background-color: #7986cb; }

        /* --- Autocomplete --- */
        #autocomplete-suggestions {
            position: absolute;
            background-color: var(--input-bg-color);
            border: 1px solid var(--primary-color);
            border-top: none;
            border-radius: 0 0 8px 8px;
            z-index: 1002; /* Mais alto que o overlay do menu */
            max-height: 200px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .suggestion-item {
            padding: 8px 10px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 10px;
            /* NOVO: Linha cinza entre itens */
            border-bottom: 1px solid #666; 
        }
        .suggestion-item:last-child {
            /* Remove a borda do último item para não duplicar o contorno */
            border-bottom: none; 
        }
        .suggestion-item:hover {
            background-color: #555;
        }

        /* --- LISTA DE ITENS (Tab 4) --- */
        .itens-search-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            position: relative;
        }
        .itens-search-field {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        #itens-search-input {
            width: 100%;
            padding: 12px 38px 12px 15px;
            background-color: var(--input-bg-color);
            color: var(--text-color);
            border: 1px solid #444;
            border-radius: var(--border-radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #itens-search-input::placeholder { color: var(--secondary-text-color); }
        #itens-search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.2);
        }
        #itens-search-clear {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: var(--secondary-text-color);
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            display: none;
            line-height: 1;
        }
        #itens-search-clear:hover { color: var(--text-color); }
        #itens-search-clear.visible { display: block; }
        .itens-search-add-btn {
            background-color: var(--primary-color);
            color: var(--bg-color);
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .itens-search-add-btn:hover { background-color: #ffd54f; }
        #itens-shopping-list {
            list-style-type: none;
            padding: 0;
            text-align: left;
            margin-top: 12px;
        }
        #itens-shopping-list li {
            background-color: var(--input-bg-color);
            border-radius: 5px;
            padding: 0.7rem 0.8rem;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }
        #itens-shopping-list li:hover { background-color: #575757; }
        .itens-item-name { flex-grow: 1; padding: 0 4px; }
        .itens-in-list-icon {
            color: var(--green-highlight);
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
            display: none;
        }
        .itens-add-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 1.1rem;
            cursor: pointer;
            width: 28px;
            text-align: center;
            padding: 0;
            flex-shrink: 0;
            display: none;
        }
        .itens-add-btn:hover { color: #ffd54f; }
        .itens-edit-btn {
            background: none;
            border: none;
            color: var(--secondary-text-color);
            font-size: 1rem;
            cursor: pointer;
            width: 28px;
            text-align: center;
            padding: 0;
            flex-shrink: 0;
            transition: color 0.2s;
        }
        .itens-edit-btn:hover { color: var(--primary-color); }
        .itens-delete-btn {
            background: none;
            border: none;
            color: var(--secondary-text-color);
            font-size: 1rem;
            cursor: pointer;
            width: 28px;
            text-align: center;
            padding: 0;
            flex-shrink: 0;
            transition: color 0.2s;
        }
        .itens-delete-btn:hover { color: var(--danger-color); }
        #itens-shopping-list li.in-list .itens-in-list-icon { display: block; }
        #itens-shopping-list li:not(.in-list) .itens-add-btn { display: block; }
        /* Modal de Adicionar/Editar Item */
        #itens-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #itens-modal-overlay.open { display: flex; }
        #itens-modal {
            background: var(--card-color);
            border-radius: var(--border-radius);
            padding: 24px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        #itens-modal h3 { margin: 0; color: var(--primary-color); font-size: 1.1rem; }
        #itens-modal-input {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg-color);
            border: 1px solid #444;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
        }
        #itens-modal-input:focus { outline: none; border-color: var(--primary-color); }
        #itens-modal-price {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg-color);
            border: 1px solid #444;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
        }
        #itens-modal-price:focus { outline: none; border-color: var(--primary-color); }
        .itens-modal-btns { display: flex; gap: 10px; }
        .itens-status {
            font-style: italic;
            color: var(--secondary-text-color);
            height: 20px;
            text-align: center;
            margin-bottom: 1rem;
        }

        @media (min-width: 768px) { .shopping-list-table colgroup col:nth-child(2) { width: 450px; } }
        @media (min-width: 1024px) { .shopping-list-table colgroup col:nth-child(2) { width: 550px; } }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-box">
            <h2><i class="fas fa-lock"></i> Acesso Seguro</h2>
            <input type="text" id="username" class="auth-input" placeholder="Nome de usuário" autocomplete="username">
            <div class="password-container">
                <input type="password" id="password" class="auth-input" placeholder="Senha" autocomplete="current-password">
                <i class="fas fa-eye" id="togglePassword"></i>
            </div>
            <div class="auth-buttons">
                <button class="custom-btn" onclick="handleLogin()">Entrar</button>
                <button class="custom-btn secondary" onclick="handleRegister()">Cadastrar</button>
            </div>
            <p id="auth-message"></p>
        </div>
    </div>

    <div id="app-container">
        <div id="side-menu" class="side-menu">
            <a href="javascript:void(0)" class="close-btn" onclick="closeNav()">&times;</a>
            <a href="#"><i class="fas fa-list-check"></i> Minha Lista</a>

    <script>
        // --- CONSTANTE DA API DE ITENS ---
        const WORKER_URL = 'https://meumercado-api.qiitomnhhh.workers.dev';

        // --- CONSTANTE DA API DO GERENCIADOR DE PREÇOS FIXOS (Tab 3) ---
        const MANAGER_WORKER_URL = 'https://meumercado-api.qiitomnhhh.workers.dev';

        // --- GERENCIAMENTO DE AUTENTICAÇÃO ---
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const authMessage = document.getElementById('auth-message');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        passwordInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                handleLogin();
            }
        });

        function showApp() {
            authContainer.style.display = 'none';
            appContainer.style.display = 'block';

            const username = localStorage.getItem('currentUser');
            const usernameDisplay = document.getElementById('username-display');
            if (username && usernameDisplay) {
                usernameDisplay.innerHTML = `<i class="fas fa-user"></i> ${username}`;
            }

            // CORRIGIDO: se o app abrir/recarregar já ONLINE mas ainda existir
            // alguma alteração pendente em `offlineList_`/`pendingDeletes_`
            // (por exemplo, um save anterior que não chegou a terminar antes
            // do reload), antes só sincronizávamos essas pendências quando o
            // evento 'online' disparava — o que não acontece em um reload
            // normal com a conexão já ativa. Isso deixava a bolinha travada
            // em "offline" (azul/roxo) até minimizar/voltar (o que força o
            // navegador a re-emitir 'online'). Agora, se já estiver online,
            // tentamos sincronizar essas pendências assim que o app abre.
            (async () => {
                if (isOnline) {
                    await syncOfflineChanges();
                }
                await loadList();
            })();
            // Polling automático desativado a pedido: atualização é manual (recarregar a página).
            // startPolling();
        }

        function showAuth(message = '', isError = false) {
            authContainer.style.display = 'flex';
            appContainer.style.display = 'none';
            authMessage.textContent = message;
            authMessage.style.color = isError ? 'var(--danger-color)' : 'var(--green-highlight)';
        }

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                showAuth('Por favor, preencha usuário e senha.', true);
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Erro ao fazer login.');
                }

                localStorage.setItem('authToken', data.token);
                localStorage.setItem('currentUser', username); 
                showApp();
            } catch (error) {
                showAuth(error.message, true);
            }
        }

        async function handleRegister() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                showAuth('Por favor, preencha usuário e senha para cadastrar.', true);
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                 if (!response.ok) {
                    throw new Error(data.message || 'Erro ao cadastrar.');
                }
                showAuth(data.message, false);
            } catch (error) {
                 showAuth(error.message, true);
            }
        }

        async function handleLogout() {
            stopPolling(); // Para a verificação contínua ao sair
            const token = localStorage.getItem('authToken');
            if (token) {
                try {
                    await fetch('/api/logout', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                } catch (error) {
                    console.error("Logout failed, but proceeding.", error);
                }
            }
            localStorage.removeItem('authToken');
            // ATUALIZADO: Remove chaves de usuário específicas ao sair
            const username = localStorage.getItem('currentUser');
            if (username) {
                 localStorage.removeItem(`shoppingList_${username}`);
                 localStorage.removeItem(`offlineList_${username}`);
                 localStorage.removeItem(`pendingDeletes_${username}`);
            }
            localStorage.removeItem('currentUser'); // Deve ser removido por último
            location.reload();
        }

        function getAuthHeaders() {
            const token = localStorage.getItem('authToken');
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function openNav() { document.getElementById("side-menu").classList.add('open'); document.getElementById("page-overlay").classList.add('show'); }
        function closeNav() { document.getElementById("side-menu").classList.remove('open'); document.getElementById("page-overlay").classList.remove('show'); }
        document.addEventListener('keydown', (event) => { 
            if (event.key === "Escape") {
                closeNav();
                fecharModalItem();
            }
        });

        function toggleTabs(btn) {
            const wrapper = btn.closest('.tabs-wrapper');
            wrapper.classList.toggle('collapsed');
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            if (tabId === 'tab-itens') {
                renderItensTab('');
                const si = document.getElementById('itens-search-input');
                if (si && !si._bound) {
                    si.addEventListener('input', () => {
                        renderItensTab(si.value);
                        const clearBtn = document.getElementById('itens-search-clear');
                        if (clearBtn) clearBtn.classList.toggle('visible', si.value.length > 0);
                    });
                    si._bound = true;
                }
            }
        }

        // --- LISTA DE ITENS (Tab 4) ---
        function renderItensTab(filtro) {
            const listElement = document.getElementById('itens-shopping-list');
            const statusMessage = document.getElementById('itens-status-message');
            if (!listElement) return;

            const searchTerm = filtro !== undefined ? filtro : (document.getElementById('itens-search-input')?.value || '');
            const normalizado = normalizeString(searchTerm.trim());

            const filtrados = itensList.filter(item =>
                item.nome && normalizeString(item.nome).includes(normalizado)
            );

            // Nomes já na lista do usuário
            const localItems = getCurrentLocalItems();
            const nomesNaLista = new Set(localItems.map(i => normalizeString(i.name)));

            listElement.innerHTML = '';

            if (filtrados.length === 0) {
                statusMessage.textContent = normalizado ? 'Nenhum item encontrado na pesquisa.' : 'A lista de itens está vazia.';
                statusMessage.style.display = 'block';
                return;
            }
            statusMessage.style.display = 'none';

            const isAdmin = localStorage.getItem('currentUser') === 'Pink';

            filtrados.forEach(item => {
                const isInList = nomesNaLista.has(normalizeString(item.nome));
                const li = document.createElement('li');
                li.className = isInList ? 'in-list' : '';
                li.dataset.itemName = item.nome;
                li.innerHTML = `
                    <i class="fas fa-check-circle itens-in-list-icon"></i>
                    <span class="itens-item-name">${item.nome}</span>
                    <button class="itens-add-btn" title="Adicionar à lista de compras"><i class="fas fa-plus"></i></button>
                    ${isAdmin ? `
                    <button class="itens-edit-btn" title="Editar item"><i class="fas fa-pencil-alt"></i></button>
                    <button class="itens-delete-btn" title="Remover item"><i class="fas fa-trash-alt"></i></button>
                    ` : ''}
                `;
                listElement.appendChild(li);
            });
        }

        function adicionarItemDaLista(itemName, li) {
            // Verifica duplicata antes de adicionar
            const existingItems = getCurrentLocalItems();
            if (existingItems.some(i => normalizeString(i.name) === normalizeString(itemName))) {
                li.classList.add('in-list'); // Marca como já na lista na UI
                return;
            }
            li.classList.add('in-list');
            buildItemRow({ id: null, name: itemName, priceShibata: 'R$ 0,00', priceNagumo: 'R$ 0,00', purchased: false }, true);
            saveList();
        }

        function clearItensSearch() {
            const si = document.getElementById('itens-search-input');
            if (si) { si.value = ''; si.focus(); }
            const clearBtn = document.getElementById('itens-search-clear');
            if (clearBtn) clearBtn.classList.remove('visible');
            renderItensTab('');
        }

        // Modal helpers
        let _modalEditNomeOriginal = null;

        function abrirModalItem(nomeExistente, nomePrefill = '') {
            _modalEditNomeOriginal = nomeExistente;
            const title = document.getElementById('itens-modal-title');
            const input = document.getElementById('itens-modal-input');
            const price = document.getElementById('itens-modal-price');
            const btnLabel = document.getElementById('itens-modal-btn-label');

            if (nomeExistente) {
                const { nomeBase, preco } = extrairNomeEPreco(nomeExistente);
                title.textContent = 'Editar Item';
                btnLabel.textContent = 'Salvar';
                input.value = nomeBase;
                price.value = preco;
            } else {
                title.textContent = 'Adicionar Item';
                btnLabel.textContent = 'Adicionar';
                input.value = nomePrefill;
                price.value = '';
            }

            document.getElementById('itens-modal-overlay').classList.add('open');
            setTimeout(() => input.focus(), 100);
        }

        function fecharModalItem() {
            document.getElementById('itens-modal-overlay').classList.remove('open');
            _modalEditNomeOriginal = null;
        }

        async function confirmarModalItem() {
            const nomeBase = document.getElementById('itens-modal-input').value.trim();
            const preco = document.getElementById('itens-modal-price').value.trim();
            if (!nomeBase) { alert('Digite o nome do item.'); return; }

            const nomeCompleto = preco ? `${nomeBase} ${preco}` : nomeBase;
            setSyncStatus('syncing');

            try {
                if (_modalEditNomeOriginal) {
                    // Edição
                    const idx = itensList.findIndex(i => i.nome === _modalEditNomeOriginal);
                    if (idx === -1) { setSyncStatus('error'); return; }
                    itensList[idx].nome = nomeCompleto;
                } else {
                    // Adição
                    if (itensList.some(i => normalizeString(i.nome) === normalizeString(nomeCompleto))) {
                        setSyncStatus('saved');
                        alert('Já existe um item com esse nome na lista.');
                        return;
                    }
                    itensList.push({ nome: nomeCompleto });
                }

                // Ordena em ordem alfabética
                itensList.sort((a, b) => sortKey(a.nome).localeCompare(sortKey(b.nome)));

                await salvarItensNoServidor(_modalEditNomeOriginal
                    ? `"${nomeBase}" atualizado com sucesso!`
                    : `"${nomeBase}" adicionado com sucesso!`);
                fecharModalItem();
            } catch (err) {
                setSyncStatus('error');
                console.error('Erro ao salvar no servidor:', err);
                alert('Erro ao salvar no servidor: ' + (err && err.message ? err.message : err));
            }
        }

        async function deletarItemLista(nomeCompleto) {
            const { nomeBase } = extrairNomeEPreco(nomeCompleto);
            if (!confirm(`Remover "${nomeBase}" da lista de itens?`)) return;
            itensList = itensList.filter(i => i.nome !== nomeCompleto);
            setSyncStatus('syncing');
            try {
                await salvarItensNoServidor(`"${nomeBase}" removido com sucesso!`);
            } catch {
                setSyncStatus('error');
                alert('Erro ao remover no servidor.');
            }
        }

        // Listener delegado para os botões de ação na lista de itens
        document.addEventListener('click', (event) => {
            const addBtn = event.target.closest('.itens-add-btn');
            if (addBtn) {
                const li = addBtn.closest('li');
                if (!li || li.classList.contains('in-list')) return;
                const itemName = li.dataset.itemName;
                if (!itemName) return;
                adicionarItemDaLista(itemName, li);
                return;
            }

            const editBtn = event.target.closest('.itens-edit-btn');
            if (editBtn) {
                const li = editBtn.closest('li');
                if (!li) return;
                abrirModalItem(li.dataset.itemName);
                return;
            }

            const deleteBtn = event.target.closest('.itens-delete-btn');
            if (deleteBtn) {
                const li = deleteBtn.closest('li');
                if (!li) return;
                deletarItemLista(li.dataset.itemName);
                return;
            }
        });

        // --- GERENCIAR ITENS (Tab 3) ---

        let _managerItemOriginal = null; // Nome original do item carregado (null = modo novo)

        function extrairNomeEPreco(nomeCompleto) {
            const match = nomeCompleto.match(/(.*?)\s+(R\$\s*[\d,.]+)\s*$/i);
            return match
                ? { nomeBase: match[1].trim(), preco: match[2].trim() }
                : { nomeBase: nomeCompleto.trim(), preco: '' };
        }

        function popularSelectItemManager() {
            // Mantido para compatibilidade com salvarItensNoServidor
        }

        // Abre o dropdown filtrando itensList pelo texto digitado
        function abrirDropdownCompleto() {
            const dropdown = document.getElementById('manager-dropdown');
            const input = document.getElementById('manager-nome-geral');
            const termo = normalizeString(input.value.trim());

            const filtrados = itensList.filter(i =>
                i.nome && (!termo || normalizeString(i.nome).includes(termo))
            ).slice(0, 200);

            dropdown.innerHTML = '';
            if (filtrados.length === 0) return;

            filtrados.forEach(item => {
                const { nomeBase } = extrairNomeEPreco(item.nome);
                const li = document.createElement('li');
                if (termo) {
                    const idx = normalizeString(nomeBase).indexOf(termo);
                    if (idx >= 0) {
                        li.innerHTML =
                            escapeHtml(nomeBase.slice(0, idx)) +
                            '<mark>' + escapeHtml(nomeBase.slice(idx, idx + input.value.trim().length)) + '</mark>' +
                            escapeHtml(nomeBase.slice(idx + input.value.trim().length));
                    } else {
                        li.textContent = nomeBase;
                    }
                } else {
                    li.textContent = nomeBase;
                }
                li.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    selecionarItemManager(item.nome);
                });
                dropdown.appendChild(li);
            });

            dropdown.classList.add('open');
        }

        function onManagerNomeInput() {
            const input = document.getElementById('manager-nome-geral');
            const dropdown = document.getElementById('manager-dropdown');
            const termo = normalizeString(input.value.trim());

            // Se o usuário limpou o campo, volta ao modo "novo"
            if (_managerItemOriginal && input.value.trim() === '') {
                _managerItemOriginal = null;
                atualizarBotoesManager(false);
            }

            const filtrados = itensList.filter(i =>
                i.nome && (!termo || normalizeString(i.nome).includes(termo))
            ).slice(0, 200);

            dropdown.innerHTML = '';

            if (filtrados.length === 0) {
                dropdown.classList.remove('open');
                return;
            }

            filtrados.forEach(item => {
                const { nomeBase } = extrairNomeEPreco(item.nome);
                const li = document.createElement('li');
                // Destaca o trecho digitado
                if (termo) {
                    const idx = normalizeString(nomeBase).indexOf(termo);
                    if (idx >= 0) {
                        li.innerHTML =
                            escapeHtml(nomeBase.slice(0, idx)) +
                            '<mark>' + escapeHtml(nomeBase.slice(idx, idx + input.value.trim().length)) + '</mark>' +
                            escapeHtml(nomeBase.slice(idx + input.value.trim().length));
                    } else {
                        li.textContent = nomeBase;
                    }
                } else {
                    li.textContent = nomeBase;
                }
                li.addEventListener('mousedown', (e) => {
                    e.preventDefault(); // Evita blur antes do click
                    selecionarItemManager(item.nome);
                });
                dropdown.appendChild(li);
            });

            dropdown.classList.add('open');
        }

        function fecharDropdownManager() {
            setTimeout(() => {
                const dropdown = document.getElementById('manager-dropdown');
                if (dropdown) dropdown.classList.remove('open');
            }, 150);
        }

        function selecionarItemManager(nomeCompleto) {
            const { nomeBase, preco } = extrairNomeEPreco(nomeCompleto);
            document.getElementById('manager-nome-geral').value = nomeBase;
            document.getElementById('manager-price-geral').value = preco;
            document.getElementById('manager-dropdown').classList.remove('open');
            _managerItemOriginal = nomeCompleto; // Marca como edição
            atualizarBotoesManager(true);
        }

        function atualizarBotoesManager(modoEdicao) {
            document.getElementById('manager-btn-icon').className = modoEdicao ? 'fas fa-save' : 'fas fa-plus';
            document.getElementById('manager-btn-label').textContent = modoEdicao ? 'Salvar' : 'Adicionar Item';
            document.getElementById('manager-btn-remover').style.display = modoEdicao ? '' : 'none';
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        async function salvarItensNoServidor(mensagemSucesso) {
            let response;
            try {
                response = await fetch(MANAGER_WORKER_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(itensList)
                });
            } catch (networkErr) {
                console.error('Falha de rede ao salvar itens:', networkErr);
                throw new Error('Falha de rede: ' + networkErr.message);
            }
            if (!response.ok) {
                let detalhe = '';
                try { detalhe = await response.text(); } catch {}
                console.error('Erro do servidor ao salvar itens:', response.status, detalhe);
                throw new Error(`HTTP ${response.status}${detalhe ? ' - ' + detalhe : ''}`);
            }
            setSyncStatus('saved');
            // Persiste localmente para evitar dado obsoleto do CDN no primeiro recarregamento
            localStorage.setItem('itensList_cache', JSON.stringify(itensList));
            localStorage.setItem('itensList_saved_at', Date.now().toString());
            renderItensTab('');
            alert(mensagemSucesso);
        }

        async function gerenciarItemManager() {
            const nomeBase = document.getElementById('manager-nome-geral').value.trim();
            const preco    = document.getElementById('manager-price-geral').value.trim();

            if (!nomeBase) { alert('Digite o nome do item.'); return; }

            const nomeCompleto = preco ? `${nomeBase} ${preco}` : nomeBase;
            setSyncStatus('syncing');

            try {
                if (_managerItemOriginal) {
                    // --- MODO EDIÇÃO ---
                    const idx = itensList.findIndex(i => i.nome === _managerItemOriginal);
                    if (idx === -1) { setSyncStatus('error'); return; }
                    itensList[idx].nome = nomeCompleto;
                    await salvarItensNoServidor(`"${nomeBase}" atualizado com sucesso!`);
                    _managerItemOriginal = nomeCompleto; // Atualiza referência
                } else {
                    // --- MODO ADIÇÃO ---
                    if (itensList.some(i => normalizeString(i.nome) === normalizeString(nomeCompleto))) {
                        setSyncStatus('saved');
                        alert('Já existe um item com esse nome na lista.');
                        return;
                    }
                    itensList.push({ nome: nomeCompleto });
                    // Ordena em ordem alfabética
                    itensList.sort((a, b) => sortKey(a.nome).localeCompare(sortKey(b.nome)));
                    await salvarItensNoServidor(`"${nomeBase}" adicionado com sucesso!`);
                    // Limpa o form após adicionar
                    document.getElementById('manager-nome-geral').value = '';
                    document.getElementById('manager-price-geral').value = '';
                    _managerItemOriginal = null;
                    atualizarBotoesManager(false);
                }
            } catch (err) {
                setSyncStatus('error');
                console.error('Erro ao salvar no servidor:', err);
                alert('Erro ao salvar no servidor: ' + (err && err.message ? err.message : err));
            }
        }

        async function removerItemManager() {
            if (!_managerItemOriginal) { alert('Selecione um item para remover.'); return; }
            const { nomeBase } = extrairNomeEPreco(_managerItemOriginal);
            if (!confirm(`Remover "${nomeBase}" da lista de itens?`)) return;

            itensList = itensList.filter(i => i.nome !== _managerItemOriginal);
            setSyncStatus('syncing');
            try {
                await salvarItensNoServidor(`"${nomeBase}" removido com sucesso!`);
                document.getElementById('manager-nome-geral').value = '';
                document.getElementById('manager-price-geral').value = '';
                _managerItemOriginal = null;
                atualizarBotoesManager(false);
            } catch {
                setSyncStatus('error');
                alert('Erro ao remover no servidor.');
            }
        }
